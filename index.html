<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHT NAVI Lite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #ffffff;
            --accent-color: #4ea8de;
            --btn-bg: #5bc0be;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: var(--card-bg);
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
        }
        nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: var(--card-bg);
            padding: 10px 0;
        }
        nav button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.9rem;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }
        nav button.active {
            background-color: var(--accent-color);
        }
        .content-section {
            display: none;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .content-section.active {
            display: block;
        }
        input, textarea, select, button.submit-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            box-sizing: border-box;
        }
        select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        button.submit-btn {
            background-color: var(--btn-bg);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .post {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-color);
        }
        .post-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .live-btn {
            display: block;
            text-align: center;
            background-color: #4ea8de;
            color: white;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>⛵ YACHT NAVI Lite</header>

    <nav>
        <button id="nav-weather" class="active" onclick="switchTab('weather')">☀️ 天気予報</button>
        <button id="nav-bbs" onclick="switchTab('bbs')">📋 掲示板</button>
        <button id="nav-camera" onclick="switchTab('camera')">📹 ライブカメラ</button>
        <button id="nav-record" onclick="switchTab('record')">📝 練習記録</button>
    </nav>

    <div id="sec-weather" class="content-section active">
        <h3>☀️ 江の島 天気・風速</h3>
        <p>最新の気象データや海の状況を確認しましょう。</p>
        <a href="https://www.riviera.co.jp/area/enoshima/livecamera/" target="_blank" class="live-btn">
            🌊 リビエラ公式ライブカメラを開く
        </a>
    </div>

    <div id="sec-bbs" class="content-section">
        <h3>📋 部内共有掲示板</h3>
        <textarea id="bbs-input" placeholder="連絡事項を入力してください..."></textarea>
        <button class="submit-btn" onclick="addPost()">投稿する</button>
        <div id="bbs-list"></div>
    </div>

    <div id="sec-camera" class="content-section">
        <h3>📹 ライブカメラ</h3>
        <p>海の状況を確認しましょう。</p>
        <a href="https://www.riviera.co.jp/area/enoshima/livecamera/" target="_blank" class="live-btn">
            🌊 リビエラ公式ライブカメラを開く
        </a>
    </div>

    <div id="sec-record" class="content-section">
        <h3>📝 練習記録</h3>
        
        <label for="record-date">📅 日付</label>
        <input type="date" id="record-date">

        <label for="record-class" style="display:block; margin-top:10px;">⛵ クラス</label>
        <select id="record-class" onchange="updateBoatOptions()">
            <option value="">-- クラスを選択してください --</option>
            <option value="470">470</option>
            <option value="スナイプ">スナイプ</option>
        </select>

        <label for="record-boat" style="display:block; margin-top:10px;">🔢 艇番</label>
        <select id="record-boat" disabled>
            <option value="">-- 先にクラスを選択してください --</option>
        </select>

        <label for="record-text" style="display:block; margin-top:10px;">📝 練習内容・反省点</label>
        <textarea id="record-text" placeholder="今日の練習内容や反省点..."></textarea>
        
        <button class="submit-btn" onclick="addRecord()">記録を保存</button>
        <div id="record-list"></div>
    </div>

        const boatData = {
            "470": ["4237", "4146", "4706", "4572", "陸待or整備"],
            "スナイプ": ["31594", "31287", "31245", "31067", "28675", "30575", "陸待or整備"]
        };

        // ページ読み込み時に記録を表示
        window.onload = function() {
            // 今日の日付を初期値に設定
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('record-date').value = today;
            
            loadRecords();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('sec-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        // クラスに応じて艇番の選択肢を切り替える
        function updateBoatOptions() {
            const classSelect = document.getElementById('record-class');
            const boatSelect = document.getElementById('record-boat');
            const selectedClass = classSelect.value;

            boatSelect.innerHTML = '';

            if (!selectedClass) {
                boatSelect.innerHTML = '<option value="">-- 先にクラスを選択してください --</option>';
                boatSelect.disabled = true;
                return;
            }

            boatSelect.disabled = false;
            const boats = boatData[selectedClass];
            boats.forEach(boat => {
                const option = document.createElement('option');
                option.value = boat;
                option.text = boat;
                boatSelect.appendChild(option);
            });
        }
