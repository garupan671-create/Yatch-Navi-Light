<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHT NAVI Lite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #ffffff;
            --accent-color: #4ea8de;
            --btn-bg: #5bc0be;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: var(--card-bg);
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
        }
        nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: var(--card-bg);
            padding: 10px 0;
        }
        nav button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.9rem;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }
        nav button.active {
            background-color: var(--accent-color);
        }
        .content-section {
            display: none;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .content-section.active {
            display: block;
        }
        input, textarea, select, button.submit-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            box-sizing: border-box;
        }
        select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        button.submit-btn {
            background-color: var(--btn-bg);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .post {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-color);
        }
        .post-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .preview-img {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 5px;
            display: none;
        }
        .uploaded-img {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 5px;
        }
        .filter-area {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
            border: 1px dashed var(--accent-color);
        }
        .live-btn {
            display: block;
            text-align: center;
            background-color: #4ea8de;
            color: white;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>⛵ YACHT NAVI Lite</header>

    <nav>
        <button id="nav-weather" class="active" onclick="switchTab('weather')">☀️ 天気予報</button>
        <button id="nav-bbs" onclick="switchTab('bbs')">📋 掲示板</button>
        <button id="nav-maintenance" onclick="switchTab('maintenance')">🛠️ ヨット管理</button>
        <button id="nav-record" onclick="switchTab('record')">📝 練習記録</button>
    </nav>

    <div id="sec-weather" class="content-section active">
        <h3>☀️ 江の島 天気・風速</h3>
        <p>最新の気象データや海の状況を確認しましょう。</p>
        
        <div style="width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 5px;">
            <iframe src="https://www.windguru.cz/widget/?s=208567&m=3&p=WIND,GUST,SMER,TMP" 
                    style="width: 100%; height: 350px; border: none;">
            </iframe>
        </div>

        <a href="https://www.riviera.co.jp/area/enoshima/livecamera/" target="_blank" class="live-btn" style="margin-top: 20px;">
            🌊 リビエラ公式ライブカメラを開く
        </a>
    </div>

    <div id="sec-bbs" class="content-section">
        <h3>📋 部内共有掲示板</h3>
        <textarea id="bbs-input" placeholder="連絡事項を入力してください..."></textarea>
        <button class="submit-btn" onclick="addPost()">投稿する</button>
        <div id="bbs-list"></div>
    </div>

    <div id="sec-maintenance" class="content-section">
        <h3>🛠️ ヨット状態・整備管理</h3>
        
        <h4>🔧 新しい整備・状態を記録</h4>
        <label for="maint-date">📅 日付</label>
        <input type="date" id="maint-date">

        <label for="maint-class" style="display:block; margin-top:10px;">⛵ クラス</label>
        <select id="maint-class" onchange="updateMaintBoatOptions()">
            <option value="">-- クラスを選択してください --</option>
            <option value="470">470</option>
            <option value="スナイプ">スナイプ</option>
        </select>

        <label for="maint-boat" style="display:block; margin-top:10px;">🔢 艇番</label>
        <select id="maint-boat" disabled>
            <option value="">-- 先にクラスを選択してください --</option>
        </select>

        <label for="maint-text" style="display:block; margin-top:10px;">📝 整備メモ・セール管理状況</label>
        <textarea id="maint-text" placeholder="整備箇所やセールの状態（例：メインセール新調など）を入力..."></textarea>

        <label for="maint-file" style="display:block; margin-top:10px;">📸 写真をアップロード</label>
        <input type="file" id="maint-file" accept="image/*" onchange="previewMaintImage(this)">
        <img id="maint-preview" class="preview-img">

        <button class="submit-btn" style="margin-top:20px;" onclick="addMaintenanceRecord()">管理記録を保存</button>
        
        <div class="filter-area">
            <label>🔍 表示する艇を絞り込む</label>
            <select id="filter-boat" onchange="filterMaintenanceRecords()">
                <option value="all">🔄 すべての艇番を表示</option>
                <option value="4237">470 - 4237</option>
                <option value="4146">470 - 4146</option>
                <option value="4706">470 - 4706</option>
                <option value="4572">470 - 4572</option>
                <option value="31594">スナイプ - 31594</option>
                <option value="31287">スナイプ - 31287</option>
                <option value="31245">スナイプ - 31245</option>
                <option value="31067">スナイプ - 31067</option>
                <option value="28675">スナイプ - 28675</option>
                <option value="30575">スナイプ - 30575</option>
                <option value="陸待or整備">陸待or整備</option>
            </select>
        </div>

        <div id="maint-list"></div>
    </div>

    <div id="sec-record" class="content-section">
        <h3>📝 練習記録</h3>
        <label for="record-date">📅 日付</label>
        <input type="date" id="record-date">

        <label for="record-class" style="display:block; margin-top:10px;">⛵ クラス</label>
        <select id="record-class" onchange="updateBoatOptions()">
            <option value="">-- クラスを選択してください --</option>
            <option value="470">470</option>
            <option value="スナイプ">スナイプ</option>
        </select>

        <label for="record-boat" style="display:block; margin-top:10px;">🔢 艇番</label>
        <select id="record-boat" disabled>
            <option value="">-- 先にクラスを選択してください --</option>
        </select>

        <label for="record-text" style="display:block; margin-top:10px;">📝 練習内容・反省点</label>
        <textarea id="record-text" placeholder="今日の練習内容や反省点..."></textarea>
        
        <button class="submit-btn" onclick="addRecord()">記録を保存</button>
        <div id="record-list"></div>
    </div>

    <script>
        const boatData = {
            "470": ["4237", "4146", "4706", "4572", "陸待or整備"],
            "スナイプ": ["31594", "31287", "31245", "31067", "28675", "30575", "陸待or整備"]
        };

        let currentMaintImageBase64 = "";

        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('record-date').value = today;
            document.getElementById('maint-date').value = today;
            
            loadRecords();
            loadMaintRecords();
        };

        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('sec-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        // --- 練習記録の連動 ---
        function updateBoatOptions() {
            const classSelect = document.getElementById('record-class');
            const boatSelect = document.getElementById('record-boat');
            const selectedClass = classSelect.value;
            boatSelect.innerHTML = '';
            if (!selectedClass) {
                boatSelect.innerHTML = '<option value="">-- 先にクラスを選択してください --</option>';
                boatSelect.disabled = true;
                return;
            }
            boatSelect.disabled = false;
            boatData[selectedClass].forEach(boat => {
                const option = document.createElement('option');
                option.value = boat;
                option.text = boat;
                boatSelect.appendChild(option);
            });
        }

        // --- ヨット管理の連動 ---
        function updateMaintBoatOptions() {
            const classSelect = document.getElementById('maint-class');
            const boatSelect = document.getElementById('maint-boat');
            const selectedClass = classSelect.value;
            boatSelect.innerHTML = '';
            if (!selectedClass) {
                boatSelect.innerHTML = '<option value="">-- 先にクラスを選択してください --</option>';
                boatSelect.disabled = true;
                return;
            }
            boatSelect.disabled = false;
            boatData[selectedClass].forEach(boat => {
                const option = document.createElement('option');
                option.value = boat;
                option.text = boat;
                boatSelect.appendChild(option);
            });
        }

        // 画像のプレビュー処理
        function previewMaintImage(input) {
            const preview = document.getElementById('maint-preview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    currentMaintImageBase64 = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.src = "";
                preview.style.display = 'none';
                currentMaintImageBase64 = "";
            }
        }

        // ヨット管理の保存
        function addMaintenanceRecord() {
            const date = document.getElementById('maint-date').value;
            const yachClass = document.getElementById('maint-class').value;
            const boat = document.getElementById('maint-boat').value;
            const text = document.getElementById('maint-text').value;

            if (!date || !yachClass || !boat || !text.trim()) {
                alert('文字項目はすべて入力してください。');
                return;
            }

            const record = {
                id: Date.now(),
                date: date,
                yachClass: yachClass,
                boat: boat,
                text: text,
                image: currentMaintImageBase64
            };

            let records = JSON.parse(localStorage.getItem('yacht_maint_records')) || [];
            records.unshift(record);
            localStorage.setItem('yacht_maint_records', JSON.stringify(records));

            // 入力欄をクリア
            document.getElementById('maint-text').value = '';
            document.getElementById('maint-file').value = '';
            document.getElementById('maint-preview').style.display = 'none';
            currentMaintImageBase64 = "";

            // 保存完了のアラートを表示
            alert('🎉 ヨット管理記録を保存しました！');

            // 保存後に一覧を更新
            filterMaintenanceRecords();
        }

        // 管理記録の表示（フィルター対応）
        function filterMaintenanceRecords() {
            const filterValue = document.getElementById('filter-boat').value;
            const records = JSON.parse(localStorage.getItem('yacht_maint_records')) || [];
            const list = document.getElementById('maint-list');
            list.innerHTML = '';

            const filtered = records.filter(rec => filterValue === 'all' || rec.boat === filterValue);

            if(filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:rgba(255,255,255,0.4);">記録がありません</p>';
                return;
            }

            filtered.forEach(rec => {
                const item = document.createElement('div');
                item.className = 'post';
                let imgTag = rec.image ? `<img src="${rec.image}" class="uploaded-img">` : '';
                item.innerHTML = `
                    <div class="post-title">［${rec.date}］${rec.yachClass} - ${rec.boat}</div>
                    <div>${rec.text.replace(/\n/g, '<br>')}</div>
                    ${imgTag}
                `;
                list.appendChild(item);
            });
        }

        function loadMaintRecords() {
            filterMaintenanceRecords();
        }

        // 練習記録の保存・読み込み
        function addRecord() {
            const date = document.getElementById('record-date').value;
            const yachClass = document.getElementById('record-class').value;
            const boat = document.getElementById('record-boat').value;
            const text = document.getElementById('record-text').value;

            if (!date || !yachClass || !boat || !text.trim()) {
                alert('すべての項目を入力してください。');
                return;
            }

            const record = { date: date, yachClass: yachClass, boat: boat, text: text };
            let records = JSON.parse(localStorage.getItem('yacht_records')) || [];
            records.unshift(record);
            localStorage.setItem('yacht_records', JSON.stringify(records));

            alert('🎉 練習記録を保存しました！');
            displayRecords(records);
            document.getElementById('record-text').value = '';
        }

        function displayRecords(records) {
            const list = document.getElementById('record-list');
            list.innerHTML = '';
            records.forEach(rec => {
                const item = document.createElement('div');
                item.className = 'post';
                item.innerHTML = `
                    <div class="post-title">［${rec.date}］${rec.yachClass} - ${rec.boat}</div>
                    <div>${rec.text.replace(/\n/g, '<br>')}</div>
                `;
                list.appendChild(item);
            });
        }

        function loadRecords() {
            const records = JSON.parse(localStorage.getItem('yacht_records')) || [];
            displayRecords(records);
        }

        function addPost() {
            const input = document.getElementById('bbs-input');
            if (!input.value.trim()) return;
            const post = document.createElement('div');
            post.className = 'post';
            post.innerText = input.value;
            document.getElementById('bbs-list').prepend(post);
            input.value = '';
        }
    </script>
</body>
</html>
