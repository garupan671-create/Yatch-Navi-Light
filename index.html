    <style>
        :root {

            --btn-bg: #5bc0be;
            --danger-color: #ff4757;
            --chat-my-msg: #3a86ff;
            --chat-other-msg: #2b2d42;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: var(--card-bg);
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
            position: relative;
        }
        .logout-btn {
            position: absolute;
            right: 15px;
            top: 12px;
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: var(--card-bg);
            padding: 10px 0;
            flex-wrap: wrap;
        }
        nav button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.85rem;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 5px;
            margin: 2px;
        }
        nav button.active {
            background-color: var(--accent-color);
        }
        .content-section {
            display: none;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .content-section.active {
            display: block;
        }
        input, textarea, select, button.submit-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            box-sizing: border-box;
        }
        select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        button.submit-btn {
            background-color: var(--btn-bg);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .post {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-color);

            border-left: 5px solid var(--danger-color);
        }
        .post-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 5px;
            color: #fff;

        .badge-high { background-color: var(--danger-color); }

            font-size: 1.1rem;
            font-weight: bold;
            color: var(--btn-bg);
            margin-top: 20px;
            padding-bottom: 5px;
            border-bottom: 2px solid var(--btn-bg);
        }

            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
        }

            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
            border: 1px dashed var(--accent-color);

            display: flex;
            gap: 10px;
            margin-bottom: 15px;

        .chat-room-btn {

            padding: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--accent-color);
            color: var(--text-color);
            border-radius: 5px;

            font-size: 0.9rem;
            line-height: 1.4;
            word-break: break-word;
            white-space: pre-wrap;

        .my-msg .chat-bubble {
            background-color: var(--chat-my-msg);

        .other-msg .chat-bubble {
            background-color: var(--chat-other-msg);
            color: white;
            border-bottom-left-radius: 2px;
        }
        .chat-info-line {
            display: flex;
            gap: 6px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 3px;
        }
        .read-count {
            color: var(--accent-color);
            font-weight: bold;
        }

            display: block;
            text-align: center;
            background-color: #4ea8de;
            color: white;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;

            margin-top: 15px;
            border-radius: 5px;
            background: #ffffff;
            color: #000000;
            padding: 5px;
            box-sizing: border-box;

        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;

        .login-box {

        async function checkAndInitTools() {
            try {
                const toolsRef = collection(db, "tools");
                const snapshot = await getDocs(toolsRef);
                if (snapshot.empty) {
                    for (const tool of initialTools) {
                        await addDoc(toolsRef, tool);
                    }
                }
            } catch (error) {
                console.error("初期データ登録エラー:", error);
            }
        }

        let allTools = [];
        function loadTools() {
            const toolsRef = collection(db, "tools");
            onSnapshot(toolsRef, (snapshot) => {
                allTools = [];
                snapshot.forEach((docSnap) => {
                    allTools.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderTools();
            });
        }

        function renderTools() {
            const list = document.getElementById('tools-list');
            if (!list) return;
            list.innerHTML = '';

            const groupBy = document.getElementById('tools-group-by').value;
            const keyword = document.getElementById('tools-search').value.toLowerCase().trim();

            const filtered = allTools.filter(t => {
                const text = `${t.name} ${t.location} ${t.category || ''} ${t.memo}`.toLowerCase();
                return text.includes(keyword);
            });

            if (filtered.length === 0) {
                list.innerHTML = '<p style="color:rgba(255,255,255,0.5); text-align:center; margin-top:20px;">該当する備品が見つかりません。</p>';
                return;
            }

            const groups = {};
            filtered.forEach(tool => {
                const key = tool[groupBy] || '未分類';
                if (!groups[key]) groups[key] = [];
                groups[key].push(tool);
            });

            for (const groupName in groups) {
                const groupHeader = document.createElement('div');
                groupHeader.className = 'group-header';
                groupHeader.innerText = `${groupBy === 'location' ? '📍' : '🏷️'} ${groupName} (${groups[groupName].length})`;
                list.appendChild(groupHeader);

                groups[groupName].forEach(tool => {
                    const card = document.createElement('div');
                    card.className = 'tool-card';
                    card.innerHTML = `
                        <div class="post-title" style="font-size:1rem;">${tool.name}</div>
                        <div style="margin-top:5px;">
                            <span class="badge badge-loc">📍 ${tool.location}</span>
                            <span class="badge badge-cat">🏷️ ${tool.category || 'その他'}</span>
                        </div>
                        <p style="margin-top:8px; font-size:0.85rem; color:rgba(255,255,255,0.8); margin-bottom:0;">📝 メモ/数量: ${tool.memo || 'なし'}</p>
                    `;
                    list.appendChild(card);
                });
            }
        }

        document.getElementById('tools-group-by')?.addEventListener('change', renderTools);
        document.getElementById('tools-search')?.addEventListener('input', renderTools);

        document.getElementById('btn-toggle-add-tool')?.addEventListener('click', () => {
            const form = document.getElementById('add-tool-form');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        });

        document.getElementById('btn-save-tool')?.addEventListener('click', async () => {
            const name = document.getElementById('new-tool-name').value.trim();
            const location = document.getElementById('new-tool-location').value;
            const category = document.getElementById('new-tool-category').value;
            const memo = document.getElementById('new-tool-memo').value.trim();

            if (!name) {
                alert('備品名を入力してください。');
                return;
            }

            try {
                await addDoc(collection(db, "tools"), {
                    name, location, category, memo,
                    createdAt: new Date()
                });
                document.getElementById('new-tool-name').value = '';
                document.getElementById('new-tool-memo').value = '';
                document.getElementById('add-tool-form').style.display = 'none';
                alert('📦 備品を追加しました！');
            } catch (e) {
                console.error("備品追加エラー:", e);
                alert('備品の追加に失敗しました。');
            }
        });

        // 💬 チャット処理 (既読機能付き)
        function switchChatRoom(roomName) {
            currentChatRoom = roomName;
            document.getElementById('btn-room-470').classList.toggle('active', roomName === '470');
            document.getElementById('btn-room-snipe').classList.toggle('active', roomName === 'snipe');
            loadChatMessages();
        }

        document.getElementById('btn-room-470')?.addEventListener('click', () => switchChatRoom('470'));
        document.getElementById('btn-room-snipe')?.addEventListener('click', () => switchChatRoom('snipe'));

        function loadChatMessages() {
            if (chatUnsubscribe) chatUnsubscribe();

            const chatRef = collection(db, `chats_${currentChatRoom}`);
            const q = query(chatRef, orderBy("createdAt", "asc"));

            chatUnsubscribe = onSnapshot(q, (snapshot) => {
                const container = document.getElementById('chat-messages-container');
                if (!container) return;

                snapshot.docChanges().forEach((change) => {
                    const docData = change.doc.data();
                    const msgId = change.doc.id;
                    const readByList = docData.readBy || [];

                    // 👁️ 未既読メッセージなら自分のUIDを自動追加
                    if (currentUserUid && !readByList.includes(currentUserUid)) {
                        const msgRef = doc(db, `chats_${currentChatRoom}`, msgId);
                        updateDoc(msgRef, {
                            readBy: arrayUnion(currentUserUid)
                        });
                    }

                    if (change.type === "added" || change.type === "modified") {
                        renderMessage(msgId, docData, container);
                    }
                });

                container.scrollTop = container.scrollHeight;
            });
        }

 function renderMessage(id, data, container) {
    const isMyMsg = data.uid === currentUserUid;
    const timeStr = formatDateTime(data.createdAt);
    const readByList = data.readBy || [];
    
    // 👁️ 自分以外の読んだ人数を計算（自分をカウントから除く）
    // 送信時に自分が readBy に入っているため、-1 します
    const otherReadCount = Math.max(0, readByList.length - 1);

    // 自分のメッセージ かつ 1人以上が読んでいる場合のみ「既読 N」を表示
    let readText = '';
    if (isMyMsg && otherReadCount > 0) {
        readText = `<span class="read-count">既読 ${otherReadCount}</span>`;
    }

    let msgContainer = document.getElementById(`msg-${id}`);

    if (!msgContainer) {
        msgContainer = document.createElement('div');
        msgContainer.id = `msg-${id}`;
        msgContainer.className = `chat-bubble-container ${isMyMsg ? 'my-msg' : 'other-msg'}`;
        container.appendChild(msgContainer);
    }

    msgContainer.innerHTML = `
        <div class="chat-user-name">${data.userName || '部員'}</div>
        <div class="chat-bubble">${data.text}</div>
        <div class="chat-info-line">
            ${readText}
            <span class="chat-time">${timeStr}</span>
        </div>
    `;
}
        document.getElementById('btn-send-chat')?.addEventListener('click', async () => {
            const input = document.getElementById('chat-input-text');
            const text = input.value.trim();

            if (!text || !currentUserUid) return;

            try {
                await addDoc(collection(db, `chats_${currentChatRoom}`), {
                    text,
                    userName: currentUserName,
                    uid: currentUserUid,
                    createdAt: new Date(),
                    readBy: [currentUserUid] // 👁️ 送信者自身を既読にして保存
                });
                input.value = '';
            } catch (e) {
                console.error("チャット送信エラー:", e);
                alert('メッセージの送信に失敗しました。');
            }
        });

        // ログイン機能と監視
        document.getElementById('btn-login')?.addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (e) {
                alert("ログイン失敗: メールアドレスまたはパスワードを確認してください。");
            }
        });

        onAuthStateChanged(auth, async (user) => {
            const loginScreen = document.getElementById('login-screen');
            const appContainer = document.getElementById('app-container');
            const nameSetupScreen = document.getElementById('name-setup-screen');
            
            if (user) {
                currentUserUid = user.uid;
                loginScreen.style.display = 'none';

                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        currentUserName = userDocSnap.data().name;
                        document.getElementById('welcome-msg').innerText = `${currentUserName} さん`;
                        nameSetupScreen.style.display = 'none';
                        appContainer.style.display = 'block';
                        
                        await checkAndInitTools();
                        loadTools();
                        loadRecords();
                        loadChatMessages();
                    } else {
                        nameSetupScreen.style.display = 'flex';
                    }
                } catch (e) {
                    console.error("ユーザーデータ取得エラー:", e);
                }
            } else {
                loginScreen.style.display = 'flex';
                appContainer.style.display = 'none';
            }
        });

        document.getElementById('btn-logout')?.addEventListener('click', () => signOut(auth));

        // ナビゲーション切り替え
        const navButtons = document.querySelectorAll('nav button');
        const sections = document.querySelectorAll('.content-section');

        navButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.id.replace('nav-', 'sec-');
                
                navButtons.forEach(btn => btn.classList.remove('active'));
                sections.forEach(sec => sec.classList.remove('active'));

                button.classList.add('active');
                document.getElementById(targetId)?.classList.add('active');
            });
        });

        // 練習記録の取得関数例（既存処理の維持用）
        function loadRecords() {
            const q = query(collection(db, "records"), orderBy("date", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('record-list');
                if(!list) return;
                list.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = 'post';
                    let timeText = data.createdAt ? `<span style="font-size:0.8rem; color:rgba(255,255,255,0.5); margin-left:8px;">(${formatDateTime(data.createdAt)})</span>` : '';
                    div.innerHTML = `
                        <div class="post-title">［${data.date}］${data.className} - ${data.boat}${timeText}</div>
                        <div><span class="badge badge-user">👤 記録者: ${data.userName || '不明'}</span></div>
                        <p style="white-space:pre-wrap; margin-top:10px; font-size:0.95rem;">${data.text}</p>
                    `;
                    list.appendChild(div);
                });
            });
        }
    </script>
