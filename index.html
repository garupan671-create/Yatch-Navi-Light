<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHT NAVI Lite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #ffffff;
            --accent-color: #4ea8de;
            --btn-bg: #5bc0be;
            --danger-color: #ff4757;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: var(--card-bg);
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
            position: relative;
        }
        .logout-btn {
            position: absolute;
            right: 15px;
            top: 12px;
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: var(--card-bg);
            padding: 10px 0;
        }
        nav button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.9rem;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }
        nav button.active {
            background-color: var(--accent-color);
        }
        .content-section {
            display: none;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .content-section.active {
            display: block;
        }
        input, textarea, select, button.submit-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            box-sizing: border-box;
        }
        select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        button.submit-btn {
            background-color: var(--btn-bg);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .post {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-color);
        }
        .post.priority-high {
            border-left: 5px solid var(--danger-color);
        }
        .post-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 5px;
            color: #fff;
        }
        .badge-high { background-color: var(--danger-color); }
        .badge-normal { background-color: rgba(255,255,255,0.2); }
        .badge-date { background-color: #ffa502; color: #000; }
        .badge-user { background-color: #a855f7; color: white; }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 5px;
            display: none;
        }
        .uploaded-img {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 5px;
        }
        .filter-area {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
            border: 1px dashed var(--accent-color);
        }
        .live-btn {
            display: block;
            text-align: center;
            background-color: #4ea8de;
            color: white;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .windguru-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 5px;
            background: #ffffff;
            color: #000000;
            padding: 5px;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 9999;
        }
        .login-box {
            width: 90%;
            max-width: 400px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        #app-container {
            display: none;
            width: 100%;
        }

        /* 👤 名前設定用ポップアップ */
        #name-setup-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 19, 43, 0.95);
            z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="text-align:center; margin-top:0; color:var(--accent-color);">⛵ YACHT NAVI ログイン</h2>
            <p style="font-size:0.9rem; color:rgba(255,255,255,0.7); text-align:center;">部員用のIDとパスワードを入力してください</p>
            
            <label for="login-email">👤 配布されたID (メール)</label>
            <input type="email" id="login-email" placeholder="例：t252034@edu.kaiyodai.ac.jp">

            <label for="login-password" style="display:block; margin-top:15px;">🔒 パスワード</label>
            <input type="password" id="login-password" placeholder="••••••••">

            <button class="submit-btn" id="btn-login" style="margin-top:25px; background-color:var(--accent-color); color:white;">ログインする</button>
        </div>
    </div>

    <div id="name-setup-screen">
        <div class="login-box">
            <h3 style="text-align:center; margin-top:0; color:var(--accent-color);">👤 部員名の登録</h3>
            <p style="font-size:0.9rem; color:rgba(255,255,255,0.7); text-align:center;">掲示板や記録に表示されるあなたの名前を設定してください。</p>
            <input type="text" id="user-display-name" placeholder="例：海大 太郎">
            <button class="submit-btn" id="btn-save-name" style="margin-top:20px;">名前を確定する</button>
        </div>
    </div>

    <div id="app-container">
        <header>
            <span id="welcome-msg" style="font-size:0.85rem; position:absolute; left:15px; top:16px; color:rgba(255,255,255,0.6);"></span>
            ⛵ YACHT NAVI Lite
            <button class="logout-btn" id="btn-logout">ログアウト</button>
        </header>

        <nav>
            <button id="nav-weather" class="active">☀️ 天気予報</button>
            <button id="nav-bbs">📋 掲示板</button>
            <button id="nav-record">📝 練習記録</button>
            <button id="nav-maintenance">🛠️ ヨット管理</button>
        </nav>

        <div id="sec-weather" class="content-section active">
            <h3>☀️ 江の島 天気・風速</h3>
            <p>最新の気象データや海の状況を確認しましょう。</p>
            
            <div class="windguru-container">
                <script id="wg_fwdg_167452_100_1781852440051">

            <a href="https://www.riviera.co.jp/area/enoshima/livecamera/" target="_blank" class="live-btn" style="margin-top: 20px;">
                🌊 リビエラ公式ライブカメラを開く
            </a>

            <div id="weather-bbs-alerts" style="margin-top: 25px; display: none;">
                <h4 style="color: var(--accent-color); margin-bottom: 10px;">🚨 間近の予定・連絡</h4>
                <div id="alert-list"></div>
            </div>
        </div>

        <div id="sec-bbs" class="content-section">
            <h3>📋 部内共有掲示板</h3>
            
            <label for="bbs-title">📝 題名（タイトル）</label>
            <input type="text" id="bbs-title" placeholder="例：今週末の集合時間について">

            <label for="bbs-priority" style="display:block; margin-top:10px;">⚠️ 重要度</label>
            <select id="bbs-priority">
                <option value="normal">💬 通常連絡</option>
                <option value="high">🚨 緊急・重要</option>
            </select>

            <label for="bbs-date" style="display:block; margin-top:10px;">📅 予定日・期限（任意）</label>
            <input type="date" id="bbs-date">

            <label for="bbs-input" style="display:block; margin-top:10px;">💬 本文（連絡内容）</label>
            <textarea id="bbs-input"rows="6"placeholder="詳しい連絡内容を入力してください..."></textarea>
            
            <button class="submit-btn" style="margin-top:15px;" id="btn-bbs-submit">投稿する</button>
            
            <div class="search-area" style="margin-top: 20px;">
                <input type="text" id="bbs-search" placeholder="🔍 過去の連絡をキーワード検索...">
            </div>
            
            <div id="bbs-list" style="margin-top: 20px;"></div>
        </div>

        <div id="sec-record" class="content-section">
            <h3>📝 練習記録</h3>
            <label for="record-date">📅 日付</label>
            <input type="date" id="record-date">

            <label for="record-class" style="display:block; margin-top:10px;">⛵ クラス</label>
            <select id="record-class">
                <option value="">-- クラスを選択してください --</option>
                <option value="470">470</option>
                <option value="スナイプ">スナイプ</option>
                <option value="レスキュー艇">レスキュー艇</option>
            </select>

            <label for="record-boat" style="display:block; margin-top:10px;">🔢 艇番</label>
            <select id="record-boat" disabled>
                <option value="">-- 先にクラスを選択してください --</option>
            </select>

            <label for="record-text" style="display:block; margin-top:10px;">📝 練習内容・反省点</label>
            <textarea id="record-text" placeholder="今日の練習内容や反省点..."></textarea>
            
            <button class="submit-btn" id="btn-record-submit">記録を保存</button>
            <div id="record-list" style="margin-top: 20px;"></div>
        </div>

        <div id="sec-maintenance" class="content-section">
            <h3>🛠️ ヨット状態・整備管理</h3>
            <h4>🔧 新しい整備・状態を記録</h4>
            <label for="maint-date">📅 日付</label>
            <input type="date" id="maint-date">

            <label for="maint-class" style="display:block; margin-top:10px;">⛵ クラス</label>
            <select id="maint-class">
                <option value="">-- クラスを選択してください --</option>
                <option value="470">470</option>
                <option value="スナイプ">スナイプ</option>
                <option value="レスキュー艇">レスキュー艇</option>
            </select>

            <label for="maint-boat" style="display:block; margin-top:10px;">🔢 艇番</label>
            <select id="maint-boat" disabled>
                <option value="">-- 先にクラスを選択してください --</option>
            </select>

            <label for="maint-text" style="display:block; margin-top:10px;">📝 整備メモ・セール管理状況</label>
            <textarea id="maint-text" placeholder="整備箇所やセールの状態を入力..."></textarea>

            <button class="submit-btn" style="margin-top:20px;" id="btn-maint-submit">管理記録を保存</button>
            
            <div class="filter-area">
                <label>🔍 表示する艇を絞り込む</label>
                <select id="filter-boat">
                    <option value="all">🔄 すべての艇番を表示</option>
                    <option value="4237">470 - 4237</option>
                    <option value="4146">470 - 4146</option>
                    <option value="4706">470 - 4706</option>
                    <option value="4572">470 - 4572</option>
                    <option value="ネプチューン">レスキュー艇 - ネプチューン</option>
                    <option value="パルパロ5">レスキュー艇 - パルパロ5</option>
                    <option value="牛若丸">レスキュー艇 - 牛若丸</option>
                    <option value="31594">スナイプ - 31594</option>
                    <option value="31287">スナイプ - 31287</option>
                    <option value="31245">スナイプ - 31245</option>
                    <option value="31067">スナイプ - 31067</option>
                    <option value="28675">スナイプ - 28675</option>
                    <option value="30575">スナイプ - 30575</option>
                    <option value="陸待or整備">陸待or整備</option>
                </select>
            </div>
            <div id="maint-list" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ0eCrYy3xYLAis0b3g4FqqOaKeYRYJf8",
            authDomain: "yacht-navi-app.firebaseapp.com",
            projectId: "yacht-navi-app",
            storageBucket: "yacht-navi-app.firebasestorage.app",
            messagingSenderId: "724690722034",
            appId: "1:724690722034:web:bbe564c44ee6eec06e846b",
            measurementId: "G-22RYBZG8MW"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserName = "未設定部員";
        let currentUserUid = "";

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyP8-MWJyATLOuhDT79pJZftV0agLCw6cgOaRLzmzK35Aogcti5uI4X2KEx84tMKuBG/exec";

        onAuthStateChanged(auth, async (user) => {
            const loginScreen = document.getElementById('login-screen');
            const appContainer = document.getElementById('app-container');
            const nameSetupScreen = document.getElementById('name-setup-screen');
            
            if (user) {
                currentUserUid = user.uid;
                loginScreen.style.display = 'none';

                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    currentUserName = userDocSnap.data().name;
                    document.getElementById('welcome-msg').innerText = `${currentUserName} さん`;
                    nameSetupScreen.style.display = 'none';
                    appContainer.style.display = 'block';
                    
                    loadRecords();
                    loadMaintenanceRecords();
                    loadBbsPosts();
                } else {
                    appContainer.style.display = 'none';
                    nameSetupScreen.style.display = 'flex';
                }
            } else {
                loginScreen.style.display = 'flex';
                appContainer.style.display = 'none';
                nameSetupScreen.style.display = 'none';
                document.getElementById('welcome-msg').innerText = "";
            }
        });

        document.getElementById('btn-save-name').addEventListener('click', async () => {
            const nameInput = document.getElementById('user-display-name').value.trim();
            if (!nameInput) {
                alert('名前を入力してください。');
                return;
            }

            try {
                await setDoc(doc(db, "users", currentUserUid), {
                    name: nameInput,
                    email: auth.currentUser.email
                });
                currentUserName = nameInput;
                document.getElementById('welcome-msg').innerText = `${currentUserName} さん`;
                document.getElementById('name-setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                
                loadRecords();
                loadMaintenanceRecords();
                loadBbsPosts();
                alert('👤 名前の登録が完了しました！');
            } catch (e) {
                console.error("Error saving name: ", e);
                alert('名前の保存に失敗しました。');
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert('IDとパスワードを入力してください。');
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(() => { alert('🎉 ログインに成功しました！'); })
                .catch((error) => {
                    alert('❌ ログインに失敗しました。');
                });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { alert('🔓 ログアウトしました。'); });
        });

        const boatData = {
            "470": ["4237", "4146", "4706", "4572", "陸待or整備"],
            "スナイプ": ["31594", "31287", "31245", "31067", "28675", "30575", "陸待or整備"],
            "レスキュー艇": ["ネプチューン", "パルパロ5", "牛若丸"]
        };

        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById('sec-' + tabId)) document.getElementById('sec-' + tabId).classList.add('active');
            if(document.getElementById('nav-' + tabId)) document.getElementById('nav-' + tabId).classList.add('active');
        }

        document.getElementById('nav-weather').addEventListener('click', () => switchTab('weather'));
        document.getElementById('nav-bbs').addEventListener('click', () => switchTab('bbs'));
        document.getElementById('nav-maintenance').addEventListener('click', () => switchTab('maintenance'));
        document.getElementById('nav-record').addEventListener('click', () => switchTab('record'));

        function updateBoatOptions(classSelectId, boatSelectId) {
            const classSelect = document.getElementById(classSelectId);
            const boatSelect = document.getElementById(boatSelectId);
            const selectedClass = classSelect.value;

            boatSelect.innerHTML = '';

            if (selectedClass && boatData[selectedClass]) {
                boatSelect.disabled = false;
                boatData[selectedClass].forEach(boat => {
                    const opt = document.createElement('option');
                    opt.value = boat;
                    opt.textContent = boat;
                    boatSelect.appendChild(opt);
                });
            } else {
                boatSelect.disabled = true;
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "-- 先にクラスを選択してください --";
                boatSelect.appendChild(opt);
            }
        }

        document.getElementById('maint-class').addEventListener('change', () => updateBoatOptions('maint-class', 'maint-boat'));
        document.getElementById('record-class').addEventListener('change', () => updateBoatOptions('record-class', 'record-boat'));

        // 🔍 掲示板キーワード検索
        document.getElementById('bbs-search').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const posts = document.querySelectorAll('#bbs-list .post');
            posts.forEach(post => {
                const title = post.querySelector('.post-title')?.innerText.toLowerCase() || "";
                const content = post.innerText.toLowerCase();
                if (title.includes(keyword) || content.includes(keyword)) {
                    post.style.display = 'block';
                } else {
                    post.style.display = 'none';
                }
            });
        });

        // 📋 掲示板の投稿・読み込み
        document.getElementById('btn-bbs-submit').addEventListener('click', async () => {
            const title = document.getElementById('bbs-title').value.trim();
            const priority = document.getElementById('bbs-priority').value;
            const date = document.getElementById('bbs-date').value;
            const text = document.getElementById('bbs-input').value.trim();

            if (!title || !text) {
                alert('題名と本文を入力してください。');
                return;
            }

            try {
                await addDoc(collection(db, "bbs"), {
                    title, priority, date, text,
                    userName: currentUserName,
                    createdAt: new Date()
                });
                document.getElementById('bbs-title').value = '';
                document.getElementById('bbs-date').value = '';
                document.getElementById('bbs-input').value = '';
                alert('📋 掲示板に投稿しました！');
            } catch (e) {
                alert('投稿に失敗しました。');
            }
        });

        function loadBbsPosts() {
            const q = query(collection(db, "bbs"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('bbs-list');
                const alertList = document.getElementById('alert-list');
                const alertArea = document.getElementById('weather-bbs-alerts');
                
                if (!list) return;
                list.innerHTML = '';
                if (alertList) alertList.innerHTML = '';

                // 📅 日付判定（今日の日付と3日後の日付を計算）
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0]; 
                
                const threeDaysLater = new Date();
                threeDaysLater.setDate(now.getDate() + 3);
                const threeDaysLaterStr = threeDaysLater.toISOString().split('T')[0];

                let hasAlerts = false;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    // ① 掲示板タブの表示処理
                    const div = document.createElement('div');
                    div.className = `post ${data.priority === 'high' ? 'priority-high' : ''}`;
                    
                    let badges = `<span class="badge ${data.priority === 'high' ? 'badge-high' : 'badge-normal'}">${data.priority === 'high' ? '🚨 重要' : '💬 通常'}</span>`;
                    if (data.date) badges += `<span class="badge badge-date">📅 ${data.date}</span>`;
                    badges += `<span class="badge badge-user">👤 ${data.userName || '部員'}</span>`;

                    const dateText = data.date ? `<span style="font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-left: 10px;">(${data.date})</span>` : '';
                    
                    div.innerHTML = `
                        <div class="post-title">${data.title}${dateText}</div>
                        <div>${badges}</div>
                        <p style="white-space:pre-wrap; margin-top:10px; font-size:0.95rem;">${data.text}</p>
                    `;
                    list.appendChild(div);

                    // ② 天気予報アラート連動判定（今日以降、かつ3日後以内）
                    if (data.date && alertList) {
                        if (data.date >= todayStr && data.date <= threeDaysLaterStr) {
                            hasAlerts = true;
                            const alertDiv = document.createElement('div');
                            alertDiv.className = `post ${data.priority === 'high' ? 'priority-high' : ''}`;
                            alertDiv.innerHTML = `
                                <div class="post-title" style="font-size: 0.95rem;">${data.title} <span style="color:#ffa502;">(期日: ${data.date})</span></div>
                                <p style="white-space:pre-wrap; margin-top:5px; font-size:0.85rem; color:rgba(255,255,255,0.8);">${data.text}</p>
                            `;
                            alertList.appendChild(alertDiv);
                        }
                    }
                });

                if (alertArea) {
                    alertArea.style.display = hasAlerts ? 'block' : 'none';
                }
            });
        }

        // 🛠️ ヨット管理の保存・読み込み・絞り込み
        document.getElementById('btn-maint-submit').addEventListener('click', async () => {
            const date = document.getElementById('maint-date').value;
            const className = document.getElementById('maint-class').value;
            const boat = document.getElementById('maint-boat').value;
            const text = document.getElementById('maint-text').value.trim();

            if (!date || !className || !boat || !text) {
                alert('すべての項目を入力してください。');
                return;
            }

            try {
                await addDoc(collection(db, "maintenance"), {
                    date, className, boat, text,
                    userName: currentUserName,
                    createdAt: new Date()
                });
                
                fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        'type': 'maintenance',
                        'date': date,
                        'class': className,
                        'boat': boat,
                        'text': text,
                        'user': currentUserName
                    })
                }).catch(e => console.error("GAS送信エラー:", e));

                document.getElementById('maint-text').value = '';
                alert('🛠️ 管理記録を保存しました！');
            } catch (e) {
                alert('保存に失敗しました。');
            }
        });

        let allMaintRecords = [];
        function loadMaintenanceRecords() {
            const q = query(collection(db, "maintenance"), orderBy("date", "desc"));
            onSnapshot(q, (snapshot) => {
                allMaintRecords = [];
                snapshot.forEach(doc => {
                    allMaintRecords.push(doc.data());
                });
                applyMaintenanceFilter();
            });
        }

        function applyMaintenanceFilter() {
            const filterValue = document.getElementById('filter-boat').value;
            const list = document.getElementById('maint-list');
            if(!list) return;
            list.innerHTML = '';

            const filtered = allMaintRecords.filter(rec => filterValue === 'all' || rec.boat === filterValue);

            if(filtered.length === 0) {
                list.innerHTML = '<p style="color:rgba(255,255,255,0.5); text-align:center;">記録がありません。</p>';
                return;
            }

            filtered.forEach(data => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `
                    <div class="post-title">［${data.date}］${data.className} - ${data.boat}</div>
                    <div><span class="badge badge-user">👤 記録者: ${data.userName || '不明'}</span></div>
                    <p style="white-space:pre-wrap; margin-top:10px; font-size:0.95rem;">${data.text}</p>
                `;
                list.appendChild(div);
            });
        }

        document.getElementById('filter-boat').addEventListener('change', applyMaintenanceFilter);

        // 📝 練習記録の保存・読み込み
        document.getElementById('btn-record-submit').addEventListener('click', async () => {
            const date = document.getElementById('record-date').value;
            const className = document.getElementById('record-class').value;
            const boat = document.getElementById('record-boat').value;
            const text = document.getElementById('record-text').value.trim();

            if (!date || !className || !boat || !text) {
                alert('すべての項目を入力してください。');
                return;
            }

            try {
                await addDoc(collection(db, "records"), {
                    date, className, boat, text,
                    userName: currentUserName,
                    createdAt: new Date()
                });

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        'type': 'record',
                        'date': date,
                        'class': className,
                        'boat': boat,
                        'text': text,
                        'user': currentUserName
                    })
                }).catch(e => console.error("GAS送信エラー:", e));

                document.getElementById('record-text').value = '';
                alert('📝 練習記録を保存しました！');
            } catch (e) {
                alert('保存に失敗しました。');
            }
        });

        function loadRecords() {
            const q = query(collection(db, "records"), orderBy("date", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('record-list');
                if(!list) return;
                list.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <div class="post-title">［${data.date}］${data.className} - ${data.boat}</div>
                        <div><span class="badge badge-user">👤 記録者: ${data.userName || '不明'}</span></div>
                        <p style="white-space:pre-wrap; margin-top:10px; font-size:0.95rem;">${data.text}</p>
                    `;
                    list.appendChild(div);
                });
            });
        }
    </script>
</body>
</html>
