    // ⚙️ 初回データ初期化
    async function checkAndInitTools() {
      try {
        const toolsRef = collection(db, "tools");
        const snapshot = await getDocs(toolsRef);
        if (snapshot.empty) {
          for (const tool of initialTools) {
            await addDoc(toolsRef, tool);
          }
        }
      } catch (error) {
        console.error("初期データ登録エラー:", error);
      }
    }

    // 📱 備品データの読み込み表示
    async function loadTools() {
      const toolsList = document.getElementById('tools-list');
      if (!toolsList) return;

      try {
        const toolsRef = collection(db, "tools");
        const snapshot = await getDocs(toolsRef);

        if (snapshot.empty) {
          toolsList.innerHTML = "<p>備品が登録されていません。</p>";
          return;
        }

        let html = '<ul style="list-style: none; padding: 0;">';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          html += `
            <li style="padding: 10px; border-bottom: 1px solid #ddd; margin-bottom: 5px; background: #f9f9f9; border-radius: 4px;">
              <strong>🏷️ ${data.name}</strong> 
              <span style="color: #666; font-size: 0.9em;">(場所: ${data.location || '未設定'})</span><br>
              <small style="color: #888;">📝 数量・メモ: ${data.memo || 'なし'}</small>
            </li>
          `;
        });
        html += '</ul>';
        toolsList.innerHTML = html;
      } catch (error) {
        console.error("データ読み込みエラー:", error);
        toolsList.innerHTML = "<p>データの読み込みに失敗しました。</p>";
      }
    }

    function loadRecords() {}

    // 🔐 ログイン状態の監視
    onAuthStateChanged(auth, async (user) => {
      const loginScreen = document.getElementById('login-screen');
      const appContainer = document.getElementById('app-container');
      const nameSetupScreen = document.getElementById('name-setup-screen');

      if (user) {
        currentUserUid = user.uid;
        loginScreen.style.display = 'none';

        const userDocRef = doc(db, "users", user.uid);
        const userDocSnap = await getDoc(userDocRef);

        if (userDocSnap.exists()) {
          currentUserName = userDocSnap.data().name;
          document.getElementById('welcome-msg').innerText = `${currentUserName} さん`;
          nameSetupScreen.style.display = 'none';
          appContainer.style.display = 'block';

          await checkAndInitTools();
          loadTools();
        } else {
          appContainer.style.display = 'none';
          nameSetupScreen.style.display = 'flex';
        }
      } else {
        loginScreen.style.display = 'flex';
        appContainer.style.display = 'none';
        nameSetupScreen.style.display = 'none';
      }
    });

    // 🔘 イベント処理
    document.getElementById('btn-save-name')?.addEventListener('click', async () => {
      const nameInput = document.getElementById('user-display-name').value.trim();
      if (!nameInput) return alert('名前を入力してください。');

      await setDoc(doc(db, "users", currentUserUid), { name: nameInput, email: auth.currentUser.email });
      document.getElementById('name-setup-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'block';
      await checkAndInitTools();
      loadTools();
    });

    document.getElementById('btn-login')?.addEventListener('click', () => {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (email && password) signInWithEmailAndPassword(auth, email, password);
    });

    document.getElementById('btn-logout')?.addEventListener('click', () => signOut(auth));

    // 👆 タブ切り替え処理
    function switchTab(tabId) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
      document.getElementById('sec-' + tabId)?.classList.add('active');
      document.getElementById('nav-' + tabId)?.classList.add('active');
    }

    document.getElementById('nav-record')?.addEventListener('click', () => switchTab('record'));
    document.getElementById('nav-maintenance')?.addEventListener('click', () => switchTab('maintenance'));
    document.getElementById('nav-bbs')?.addEventListener('click', () => switchTab('bbs'));
    document.getElementById('nav-weather')?.addEventListener('click', () => switchTab('weather'));
    document.getElementById('nav-tools')?.addEventListener('click', () => switchTab('tools'));
