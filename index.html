<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHT NAVI Lite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #ffffff;
            --accent-color: #4ea8de;
            --btn-bg: #5bc0be;
            --danger-color: #ff4757;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: var(--card-bg);
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
            position: relative;
        }
        .logout-btn {
            position: absolute;
            right: 15px;
            top: 12px;
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: var(--card-bg);
            padding: 10px 0;
        }
        nav button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.9rem;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }
        nav button.active {
            background-color: var(--accent-color);
        }
        .content-section {
            display: none;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .content-section.active {
            display: block;
        }
        input, textarea, select, button.submit-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            box-sizing: border-box;
        }
        select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        button.submit-btn {
            background-color: var(--btn-bg);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .post {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-color);
        }
        .post.priority-high {
            border-left: 5px solid var(--danger-color);
        }
        .post-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 5px;
            color: #fff;
        }
        .badge-high { background-color: var(--danger-color); }
        .badge-normal { background-color: rgba(255,255,255,0.2); }
        .badge-date { background-color: #ffa502; color: #000; }
        .badge-user { background-color: #a855f7; color: white; }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 5px;
            display: none;
        }
        .uploaded-img {
            max-width: 100%;
            margin-top: 10px;
            border-radius: 5px;
        }
        .filter-area {
            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
            border: 1px dashed var(--accent-color);
        }
        .live-btn {
            display: block;
            text-align: center;
            background-color: #4ea8de;
            color: white;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .windguru-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 5px;
            background: #ffffff;
            color: #000000;
            padding: 5px;
            box-sizing: border-box;
            -webkit-overflow-scrolling: touch;
        }

        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            z-index: 9999;
        }
        .login-box {
            width: 90%;
            max-width: 400px;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        #app-container {
            display: none;
            width: 100%;
        }

        /* 👤 名前設定用ポップアップ */
        #name-setup-screen {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(11, 19, 43, 0.95);
            z-index: 10000;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="text-align:center; margin-top:0; color:var(--accent-color);">⛵ YACHT NAVI ログイン</h2>
            <p style="font-size:0.9rem; color:rgba(255,255,255,0.7); text-align:center;">部員用のIDとパスワードを入力してください</p>
            
            <label for="login-email">👤 配布されたID (メール)</label>
            <input type="email" id="login-email" placeholder="例：t252034@edu.kaiyodai.ac.jp">

    </div>

    <div id="name-setup-screen">
        <div class="login-box">
            <h3 style="text-align:center; margin-top:0; color:var(--accent-color);">👤 部員名の登録</h3>
            <p style="font-size:0.9rem; color:rgba(255,255,255,0.7); text-align:center;">掲示板や記録に表示されるあなたの名前を設定してください。</p>
            <input type="text" id="user-display-name" placeholder="例：海大 太郎">
            <button class="submit-btn" id="btn-save-name" style="margin-top:20px;">名前を確定する</button>
        </div>
    </div>

    <div id="app-container">
        <header>
            <span id="welcome-msg" style="font-size:0.85rem; position:absolute; left:15px; top:16px; color:rgba(255,255,255,0.6);"></span>
            ⛵ YACHT NAVI Lite
            <button class="logout-btn" id="btn-logout">ログアウト</button>
        </header>

        <nav>
            <button id="nav-weather" class="active">☀️ 天気予報</button>
            <button id="nav-bbs">📋 掲示板</button>
            <button id="nav-maintenance">🛠️ ヨット管理</button>
            <button id="nav-record">📝 練習記録</button>
        </nav>

        <div id="sec-weather" class="content-section active">

            <p>最新の気象データや海の状況を確認しましょう。</p>

            </a>

        <div id="sec-bbs" class="content-section">
            <h3>📋 部内共有掲示板</h3>
            
            <label for="bbs-title">📝 題名（タイトル）</label>
            <input type="text" id="bbs-title" placeholder="例：今週末の集合時間について">

            <label for="bbs-priority" style="display:block; margin-top:10px;">⚠️ 重要度</label>
            <select id="bbs-priority">
                <option value="normal">💬 通常連絡</option>
                <option value="high">🚨 緊急・重要</option>
            </select>

            <label for="bbs-date" style="display:block; margin-top:10px;">📅 予定日・期限（任意）</label>
            <input type="date" id="bbs-date">

            <label for="bbs-input" style="display:block; margin-top:10px;">💬 本文（連絡内容）</label>
            <textarea id="bbs-input" placeholder="詳しい連絡内容を入力してください..."></textarea>
            
            <button class="submit-btn" style="margin-top:15px;" id="btn-bbs-submit">投稿する</button>
            
            <div id="bbs-list" style="margin-top: 20px;"></div>
        </div>

        <div id="sec-maintenance" class="content-section">
            <h3>🛠️ ヨット状態・整備管理</h3>
            <h4>🔧 新しい整備・状態を記録</h4>
            <label for="maint-date">📅 日付</label>
            <input type="date" id="maint-date">

            <label for="maint-class" style="display:block; margin-top:10px;">⛵ クラス</label>
            <select id="maint-class">
                <option value="">-- クラスを選択してください --</option>
                <option value="470">470</option>

            </select>

            <label for="maint-boat" style="display:block; margin-top:10px;">🔢 艇番</label>
            <select id="maint-boat" disabled>
                <option value="">-- 先にクラスを選択してください --</option>
            </select>

            <label for="maint-text" style="display:block; margin-top:10px;">📝 整備メモ・セール管理状況</label>
            <textarea id="maint-text" placeholder="整備箇所やセールの状態を入力..."></textarea>

            <label for="maint-file" style="display:block; margin-top:10px;">📸 写真をアップロード</label>
            <input type="file" id="maint-file" accept="image/*">

            <button class="submit-btn" style="margin-top:20px;" id="btn-maint-submit">管理記録を保存</button>
            
            <div class="filter-area">
                <label>🔍 表示する艇を絞り込む</label>
                <select id="filter-boat">
                    <option value="all">🔄 すべての艇番を表示</option>
                    <option value="4237">470 - 4237</option>
                    <option value="4146">470 - 4146</option>
                    <option value="4706">470 - 4706</option>
                    <option value="4572">470 - 4572</option>
                    <option value="パルパロ5">レスキュー艇 - パルパロ5</option>
                    <option value="牛若丸">レスキュー艇 - 牛若丸</option>
                    <option value="31594">スナイプ - 31594</option>
                    <option value="31287">スナイプ - 31287</option>
                    <option value="31245">スナイプ - 31245</option>
                    <option value="31067">スナイプ - 31067</option>
                    <option value="28675">スナイプ - 28675</option>
                    <option value="30575">スナイプ - 30575</option>
                    <option value="陸待or整備">陸待or整備</option>
                </select>
            </div>
            <div id="maint-list"></div>
        </div>

        <div id="sec-record" class="content-section">
            <h3>📝 練習記録</h3>
            <label for="record-date">📅 日付</label>
            <input type="date" id="record-date">

            <label for="record-class" style="display:block; margin-top:10px;">⛵ クラス</label>
            <select id="record-class">
                <option value="">-- クラスを選択してください --</option>
                <option value="470">470</option>
                <option value="スナイプ">スナイプ</option>
            </select>

            <label for="record-boat" style="display:block; margin-top:10px;">🔢 艇番</label>
            <select id="record-boat" disabled>
                <option value="">-- 先にクラスを選択してください --</option>
            </select>

            <label for="record-text" style="display:block; margin-top:10px;">📝 練習内容・反省点</label>
            <textarea id="record-text" placeholder="今日の練習内容や反省点..."></textarea>
            
            <button class="submit-btn" id="btn-record-submit">記録を保存</button>
            <div id="record-list"></div>
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQ0eCrYy3xYLAis0b3g4FqqOaKeYRYJf8",
            authDomain: "yacht-navi-app.firebaseapp.com",
            projectId: "yacht-navi-app",
            storageBucket: "yacht-navi-app.firebasestorage.app",
            messagingSenderId: "724690722034",
            appId: "1:724690722034:web:bbe564c44ee6eec06e846b",
            measurementId: "G-22RYBZG8MW"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserName = "未設定部員";
        let currentUserUid = "";

        // 🔗 GASのウェブアプリのURL

         const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxgJpapiejENTUKZoltEP55BUf7SRGLnIQLHzrgNaq5_rnukIPq3KycUaHgSSa3NXJ6/exec";


        onAuthStateChanged(auth, async (user) => {
            const loginScreen = document.getElementById('login-screen');
            const appContainer = document.getElementById('app-container');
            const nameSetupScreen = document.getElementById('name-setup-screen');
            
            if (user) {
                currentUserUid = user.uid;
                loginScreen.style.display = 'none';

                const userDocRef = doc(db, "users", user.uid);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    currentUserName = userDocSnap.data().name;
                    document.getElementById('welcome-msg').innerText = `${currentUserName} さん`;
                    nameSetupScreen.style.display = 'none';
                    appContainer.style.display = 'block';
                    
                    loadRecords();
                    filterMaintenanceRecords();
                    loadBbsPosts();
                } else {
                    appContainer.style.display = 'none';
                    nameSetupScreen.style.display = 'flex';
                }
            } else {
                loginScreen.style.display = 'flex';
                appContainer.style.display = 'none';
                nameSetupScreen.style.display = 'none';
                document.getElementById('welcome-msg').innerText = "";
            }
        });

        document.getElementById('btn-save-name').addEventListener('click', async () => {
            const nameInput = document.getElementById('user-display-name').value.trim();
            if (!nameInput) {
                alert('名前を入力してください。');
                return;
            }

            try {
                await setDoc(doc(db, "users", currentUserUid), {
                    name: nameInput,
                    email: auth.currentUser.email
                });
                currentUserName = nameInput;
                document.getElementById('welcome-msg').innerText = `${currentUserName} さん`;
                document.getElementById('name-setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                
                loadRecords();
                filterMaintenanceRecords();
                loadBbsPosts();
                alert('👤 名前の登録が完了しました！');
            } catch (e) {
                console.error("Error saving name: ", e);
                alert('名前の保存に失敗しました。ルールを確認してください。');
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert('IDとパスワードを入力してください。');
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(() => { alert('🎉 ログインに成功しました！'); })
                .catch((error) => {
                    alert('❌ ログインに失敗しました。');
                });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { alert('🔓 ログアウトしました。'); });
        });

        const boatData = {
            "470": ["4237", "4146", "4706", "4572", "陸待or整備"],
            "スナイプ": ["31594", "31287", "31245", "31067", "28675", "30575", "陸待or整備"]
        };

        let currentMaintImageBase64 = "";

        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById('sec-' + tabId)) document.getElementById('sec-' + tabId).classList.add('active');
            if(document.getElementById('nav-' + tabId)) document.getElementById('nav-' + tabId).classList.add('active');
        }

        document.getElementById('nav-weather').addEventListener('click', () => switchTab('weather'));
        document.getElementById('nav-bbs').addEventListener('click', () => switchTab('bbs'));
        document.getElementById('nav-maintenance').addEventListener('click', () => switchTab('maintenance'));
        document.getElementById('nav-record').addEventListener('click', () => switchTab('record'));

        function addPost() {
            const titleInput = document.getElementById('bbs-title');
            const priorityInput = document.getElementById('bbs-priority');
            const dateInput = document.getElementById('bbs-date');
            const textInput = document.getElementById('bbs-input');

            if (!titleInput.value.trim() || !textInput.value.trim()) {

                alert('題名と本文は必ず入力してください。');
                return;
            }

            const post = {
                title: titleInput.value,
                priority: priorityInput.value,
                date: dateInput.value,
                text: textInput.value,
                author: currentUserName
            };

            let posts = JSON.parse(localStorage.getItem('yacht_bbs_posts')) || [];
            posts.unshift(post);
            localStorage.setItem('yacht_bbs_posts', JSON.stringify(posts));

            titleInput.value = ''; dateInput.value = ''; textInput.value = ''; priorityInput.value = 'normal';
            displayBbsPosts(posts);
        }
        document.getElementById('btn-bbs-submit').addEventListener('click', addPost);

        function displayBbsPosts(posts) {
            const list = document.getElementById('bbs-list');
            if(!list) return;
            list.innerHTML = '';
            
            if(posts.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:rgba(255,255,255,0.4);">投稿がありません</p>';
                return;
            }

            posts.forEach(post => {
                const item = document.createElement('div');
                item.className = `post priority-${post.priority}`;

                let priorityBadge = post.priority === 'high' ? '<span class="badge badge-high">🚨 重要</span>' : '<span class="badge badge-normal">💬 通常</span>';
                let dateBadge = post.date ? `<span class="badge badge-date">📅 予定日: ${post.date}</span>` : '';
                let authorBadge = `<span class="badge badge-user">👤 投稿者: ${post.author || '不明'}</span>`;

                item.innerHTML = `
                    <div class="post-title">${priorityBadge}${dateBadge}${authorBadge}${post.title}</div>
                    <div style="margin-top: 5px;">${post.text.replace(/\n/g, '<br>')}</div>
                `;
                list.appendChild(item);
            });
        }

        function loadBbsPosts() {
            const posts = JSON.parse(localStorage.getItem('yacht_bbs_posts')) || [];
            displayBbsPosts(posts);
        }

        function updateBoatOptions() {
            const classSelect = document.getElementById('record-class');
            const boatSelect = document.getElementById('record-boat');
            if(!classSelect || !boatSelect) return;
            const selectedClass = classSelect.value;
            boatSelect.innerHTML = '';
            if (!selectedClass) {
                boatSelect.innerHTML = '<option value="">-- 先にクラスを選択してください --</option>';
                boatSelect.disabled = true;
                return;
            }
            boatSelect.disabled = false;
            boatData[selectedClass].forEach(boat => {
                const option = document.createElement('option'); option.value = boat; option.text = boat;
                boatSelect.appendChild(option);
            });
        }
        document.getElementById('record-class').addEventListener('change', updateBoatOptions);

        function updateMaintBoatOptions() {
            const classSelect = document.getElementById('maint-class');
            const boatSelect = document.getElementById('maint-boat');
            if(!classSelect || !boatSelect) return;
            const selectedClass = classSelect.value;
            boatSelect.innerHTML = '';
            if (!selectedClass) {
                boatSelect.innerHTML = '<option value="">-- 先にクラスを選択してください --</option>';
                boatSelect.disabled = true;
                return;
            }
            boatSelect.disabled = false;
            boatData[selectedClass].forEach(boat => {
                const option = document.createElement('option'); option.value = boat; option.text = boat;
                boatSelect.appendChild(option);
            });
        }
        document.getElementById('maint-class').addEventListener('change', updateMaintBoatOptions);

        function previewMaintImage(e) {
            const input = e.target;
            const preview = document.getElementById('maint-preview');
            if(!preview) return;
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result; preview.style.display = 'block';
                    currentMaintImageBase64 = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.src = ""; preview.style.display = 'none'; currentMaintImageBase64 = "";
            }
        }
        document.getElementById('maint-file').addEventListener('change', previewMaintImage);

        async function addMaintenanceRecord() {
            const date = document.getElementById('maint-date').value;
            const yachClass = document.getElementById('maint-class').value;
            const boat = document.getElementById('maint-boat').value;
            const text = document.getElementById('maint-text').value;
            const submitBtn = document.getElementById('btn-maint-submit');

            if (!date || !yachClass || !boat || !text.trim()) {
                alert('文字項目はすべて入力してください。');
                return;
            }

            let finalImageUrl = "";

            if (currentMaintImageBase64) {
                submitBtn.disabled = true;
                submitBtn.innerText = "📸 写真をGoogleドライブに保存中...";

                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: "POST",
                        body: JSON.stringify({
                            image: currentMaintImageBase64,
                            className: yachClass,
                            boatNumber: boat
                        })
                    });
                    const result = await response.json();

                    if (result.status === "success") {
                        finalImageUrl = result.url;
                    } else {
                        console.error("GAS Error:", result.message);
                        alert("⚠️ Googleドライブへの写真保存に失敗しました。記録のみ保存します。");
                    }
                } catch (error) {
                    console.error("Fetch Error:", error);
                    alert("⚠️ ネットワークエラーにより写真の同期に失敗しました。");
                }
            }

            const record = {
                id: Date.now(),
                date: date,
                yachClass: yachClass,
                boat: boat,
                text: text,
                image: finalImageUrl,
                author: currentUserName
            };

            let records = JSON.parse(localStorage.getItem('yacht_maint_records')) || [];
            records.unshift(record);
            localStorage.setItem('yacht_maint_records', JSON.stringify(records));

            document.getElementById('maint-text').value = '';
            document.getElementById('maint-file').value = '';
            document.getElementById('maint-preview').style.display = 'none';
            currentMaintImageBase64 = "";

            submitBtn.disabled = false;
            submitBtn.innerText = "管理記録を保存";

            alert('🎉 ヨット管理記録を保存しました！');
            filterMaintenanceRecords();
        }
        document.getElementById('btn-maint-submit').addEventListener('click', addMaintenanceRecord);

        function filterMaintenanceRecords() {
            const filterValue = document.getElementById('filter-boat').value;
            const records = JSON.parse(localStorage.getItem('yacht_maint_records')) || [];
            const list = document.getElementById('maint-list');
            if(!list) return;
            list.innerHTML = '';

            const filtered = records.filter(rec => filterValue === 'all' || rec.boat === filterValue);

            if(filtered.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:rgba(255,255,255,0.4);">記録がありません</p>';
                return;
            }

            filtered.forEach(rec => {
                const item = document.createElement('div');
                item.className = 'post';
                let imgTag = rec.image ? `<img src="${rec.image}" class="uploaded-img">` : '';
                let authorBadge = `<span class="badge badge-user" style="margin-left:5px;">👤 整備: ${rec.author || '不明'}</span>`;
                item.innerHTML = `
                    <div class="post-title">［${rec.date}］${rec.yachClass} - ${rec.boat}${authorBadge}</div>
                    <div>${rec.text.replace(/\n/g, '<br>')}</div>
                    ${imgTag}
                `;
                list.appendChild(item);
            });
        }
        document.getElementById('filter-boat').addEventListener('change', filterMaintenanceRecords);

        function addRecord() {
            const date = document.getElementById('record-date').value;
            const yachClass = document.getElementById('record-class').value;
            const boat = document.getElementById('record-boat').value;
            const text = document.getElementById('record-text').value;

            if (!date || !yachClass || !boat || !text.trim()) {
                alert('すべての項目を入力してください。');
                return;
            }

            const record = { date: date, yachClass: yachClass, boat: boat, text: text, author: currentUserName };
            let records = JSON.parse(localStorage.getItem('yacht_records')) || [];
            records.unshift(record);
            localStorage.setItem('yacht_records', JSON.stringify(records));

            alert('🎉 練習記録を保存しました！');
            displayRecords(records);
            document.getElementById('record-text').value = '';
        }
        document.getElementById('btn-record-submit').addEventListener('click', addRecord);

        function displayRecords(records) {
            const list = document.getElementById('record-list');
            if(!list) return;
            list.innerHTML = '';
            records.forEach(rec => {
                const item = document.createElement('div');
                item.className = 'post';
                let authorBadge = `<span class="badge badge-user" style="margin-left:5px;">👤 記録者: ${rec.author || '不明'}</span>`;
                item.innerHTML = `
                    <div class="post-title">［${rec.date}］${rec.yachClass} - ${rec.boat}${authorBadge}</div>
                    <div>${rec.text.replace(/\n/g, '<br>')}</div>
                `;
                list.appendChild(item);
            });
        }

        const today = new Date().toISOString().split('T')[0];
        if(document.getElementById('record-date')) document.getElementById('record-date').value = today;
        if(document.getElementById('maint-date')) document.getElementById('maint-date').value = today;

        function loadRecords() {
            const records = JSON.parse(localStorage.getItem('yacht_records')) || [];
            displayRecords(records);
        }
    </script>
</body>
</html>
