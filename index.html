<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHT NAVI Lite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #ffffff;
            --accent-color: #4ea8de;
            --btn-bg: #5bc0be;
            --danger-color: #ff4757;
            --chat-my-msg: #3a86ff;
            --chat-other-msg: #2b2d42;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: var(--card-bg);
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
            position: relative;
        }
        .logout-btn {
            position: absolute;
            right: 15px;
            top: 12px;
            background-color: transparent;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
            margin-bottom: 80px;
        }
        nav {
            display: flex;
            justify-content: space-around;
            background-color: var(--card-bg);
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 600px;
            border-top: 1px solid var(--accent-color);
            z-index: 1000;
        }
        nav button {
            background: none;
            border: none;
            color: var(--text-color);
            padding: 12px 5px;
            font-size: 0.75rem;
            flex: 1;
            cursor: pointer;
            text-align: center;
        }
        nav button.active {
            color: var(--accent-color);
            font-weight: bold;
            border-top: 3px solid var(--accent-color);
        }
        .content-section {
            display: none;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .content-section.active {
            display: block;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #3a506b;
            background-color: #0b132b;
            color: white;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 5px;
            color: #0b132b;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        .post {
            background-color: #0b132b;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid var(--accent-color);
        }
        .post-title {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 5px;
        }
        .badge-user {
            background-color: #3a506b;
            color: white;
        }
        .chat-bubble {
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .my-msg {
            background-color: var(--chat-my-msg);
            margin-left: auto;
            border-bottom-right-radius: 2px;
        }
        .other-msg {
            background-color: var(--chat-other-msg);
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }
        #login-screen, #name-setup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .login-box {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            width: 85%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <h2 style="text-align:center; margin-top:0; color:var(--accent-color);">⛵ YACHT NAVI ログイン</h2>
            <p style="font-size:0.9rem; color:rgba(255,255,255,0.7); text-align:center;">部員用のIDとパスワードを入力してください</p>
            
            <label for="login-email">👤 配布されたID (メール)</label>
            <input type="email" id="login-email" placeholder="例：t252034@edu.kaiyodai.ac.jp">

            <label for="login-password" style="display:block; margin-top:15px;">🔒 パスワード</label>
            <input type="password" id="login-password" placeholder="••••••••">

            <button class="submit-btn" id="btn-login" style="margin-top:25px; background-color:var(--accent-color); color:white;">ログインする</button>
        </div>
    </div>

    <div id="name-setup-screen" style="display:none;">
        <div class="login-box">
            <h3 style="text-align:center; margin-top:0; color:var(--accent-color);">👤 部員名の登録</h3>
            <p style="font-size:0.9rem; color:rgba(255,255,255,0.7); text-align:center;">掲示板や記録に表示されるあなたの名前を設定してください。</p>
            <input type="text" id="user-display-name" placeholder="例：海大 太郎">
            <button class="submit-btn" id="btn-save-name" style="margin-top:20px;">名前を確定する</button>
        </div>
    </div>

    <div id="app-container" class="container" style="display:none;">
        <header>
            ⛵ YACHT NAVI Lite
            <button id="btn-logout" class="logout-btn">ログアウト</button>
        </header>

        <div id="sec-weather" class="content-section active">
            <h3>☀️ 練習海面の天気予報</h3>
            <p style="font-size:0.85rem; color:rgba(255,255,255,0.7);">八景島周辺の気象データ</p>
            <div id="weather-info">データを読み込み中...</div>
        </div>

        <div id="sec-bbs" class="content-section">
            <h3>📋 部内掲示板</h3>
            <div id="bbs-list"></div>
        </div>

        <div id="sec-chat" class="content-section">
            <h3>💬 チームチャット</h3>
            <div id="chat-messages" style="height: 300px; overflow-y: auto; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 15px;"></div>
            <input type="text" id="chat-input" placeholder="メッセージを入力...">
            <button class="submit-btn" id="btn-send-chat">送信</button>
        </div>

        <div id="sec-record" class="content-section">
            <h3>📝 練習記録</h3>
            <div id="record-list"></div>
        </div>

        <div id="sec-maintenance" class="content-section">
            <h3>🛠️ ヨット整備・艇体管理</h3>
            <label for="maint-boat-select">⛵ 艇体を選択</label>
            <select id="maint-boat-select">
                <option value="470 - 4811">470 - 4811</option>
                <option value="470 - 4688">470 - 4688</option>
                <option value="470 - 4541">470 - 4541</option>
                <option value="470 - 4390">470 - 4390</option>
                <option value="470 - 4252">470 - 4252</option>
                <option value="スナイプ - 31287">スナイプ - 31287</option>
                <option value="スナイプ - 31245">スナイプ - 31245</option>
                <option value="スナイプ - 31067">スナイプ - 31067</option>
                <option value="スナイプ - 28675">スナイプ - 28675</option>
                <option value="スナイプ - 30575">スナイプ - 30575</option>
                <option value="陸待or整備">陸待or整備</option>
            </select>
            <div id="maint-list" style="margin-top: 20px;"></div>
        </div>

        <div id="sec-tools" class="content-section">
            <h3>📦 備品・工具管理</h3>

            <button id="btn-toggle-add-tool" class="submit-btn" style="background-color: var(--accent-color); color: white; margin-bottom: 15px;">
                ➕ 新しい備品を追加する
            </button>

            <div id="add-tool-form" style="display: none; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--accent-color);">
                <h4 style="margin-top:0; color:var(--accent-color);">📦 新規備品の登録</h4>
                
                <label>📌 備品名</label>
                <input type="text" id="new-tool-name" placeholder="例：ドライバー">

                <label style="display:block; margin-top:10px;">📍 保管場所</label>
                <select id="new-tool-location">
                    <option value="計測用">計測用</option>
                    <option value="工具用">工具用</option>
                    <option value="テンダーボックス">テンダーボックス</option>
                    <option value="スプレーボックス">スプレーボックス</option>
                    <option value="その他">その他</option>
                </select>

                <label style="display:block; margin-top:10px;">🏷️ 種類（カテゴリ）</label>
                <select id="new-tool-category">
                    <option value="🛠️ 工具・作業用品">🛠️ 工具・作業用品</option>
                    <option value="🧪 化学品・スプレー・油脂">🧪 化学品・スプレー・油脂</option>
                    <option value="📏 計測・文房具">📏 計測・文房具</option>
                    <option value="🩹 補修・テープ・ロープ類">🩹 補修・テープ・ロープ類</option>
                    <option value="📄 書類・マニュアル">📄 書類・マニュアル</option>
                    <option value="📦 その他備品">📦 その他備品</option>
                </select>

                <label style="display:block; margin-top:10px;">📝 数量 / メモ</label>
                <input type="text" id="new-tool-memo" placeholder="例：2個、赤色">

                <button class="submit-btn" id="btn-save-tool" style="margin-top:15px;">登録する</button>
            </div>

            <div class="filter-area">
                <label>🗂️ グループ表示の切り替え</label>
                <select id="tools-group-by">
                    <option value="location">📍 保管場所ごとに表示</option>
                    <option value="category">🏷️ 種類（カテゴリ）ごとに表示</option>
                </select>

                <label style="display:block; margin-top:10px;">🔍 備品名やメモで検索</label>
                <input type="text" id="tools-search" placeholder="キーワードを入力..." style="margin-top:5px;">
            </div>

            <div id="tools-list" style="margin-top: 10px;"></div>
        </div>

        <div id="sec-finance" class="content-section">
            <h3>💰 部活会計・領収書管理</h3>

            <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <h4 style="margin-top:0; color:var(--accent-color);">📷 領収書の自動読み取り</h4>
                <label for="receipt-image">レシート・領収書の写真を撮影/選択</label>
                <input type="file" id="receipt-image" accept="image/*">
                
                <button type="button" class="submit-btn" id="btn-scan-receipt" style="background-color: var(--accent-color); color: white; margin-top: 10px;">
                    🔍 画像から自動入力する
                </button>
                <div id="scan-status" style="font-size: 0.85rem; color: #ffa502; margin-top: 5px;"></div>
            </div>

            <h4>📝 支出の記録</h4>
            <label for="finance-date">📅 日付</label>
            <input type="date" id="finance-date">

            <label for="finance-amount" style="display:block; margin-top:10px;">💴 金額（円）</label>
            <input type="number" id="finance-amount" placeholder="例：1500">

            <label for="finance-title" style="display:block; margin-top:10px;">📌 用途・品名</label>
            <input type="text" id="finance-title" placeholder="例：ガソリン代、レスキュー艇補修用品">

            <label for="finance-payer" style="display:block; margin-top:10px;">👤 支払者（立替人）</label>
            <input type="text" id="finance-payer" placeholder="例：海大 太郎">

            <button class="submit-btn" id="btn-finance-submit" style="margin-top:20px;">支出を記録する</button>

            <div id="finance-list" style="margin-top: 20px;"></div>
        </div>

        <nav>
            <button id="nav-weather" class="active">☀️ 天気</button>
            <button id="nav-bbs">📋 掲示板</button>
            <button id="nav-chat">💬 チャット</button>
            <button id="nav-record">📝 記録</button>
            <button id="nav-maintenance">🛠️ 整備</button>
            <button id="nav-tools">📦 備品</button>
            <button id="nav-finance">💰 会計</button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // Firebase初期化 🔑
        const firebaseConfig = {
            apiKey: "AIzaSyCQ0eCrYy3xYLAis0b3g4FqqOaKeYRYJf8",
            authDomain: "yacht-navi-app.firebaseapp.com",
            projectId: "yacht-navi-app",
            storageBucket: "yacht-navi-app.firebasestorage.app",
            messagingSenderId: "724690722034",
            appId: "1:724690722034:web:bbe564c44ee6eec06e846b",
            measurementId: "G-22RYBZG8MW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserUid = null;
        let currentUserName = "匿名部員";

        function formatDateTime(timestamp) {
            if (!timestamp) return '';
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${month}/${day} ${hours}:${minutes}`;
        }

        // 🔄 ログイン状態のリアルタイム監視
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserUid = user.uid;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                if (userDoc.exists() && userDoc.data().name) {
                    currentUserName = userDoc.data().name;
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('name-setup-screen').style.display = 'none';
                    document.getElementById('app-container').style.display = 'block';
                    
                    loadBbsPosts();
                    loadChatMessages();
                    loadRecords();
                } else {
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('name-setup-screen').style.display = 'flex';
                    document.getElementById('app-container').style.display = 'none';
                }
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('name-setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'none';
            }
        });

        // 🔑 ログインボタン
        document.getElementById('btn-login')?.addEventListener('click', async () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert('📧 メールアドレスと🔑 パスワードを入力してください。');
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                console.error('ログインエラー:', error);
                alert('❌ ログインに失敗しました: ' + error.message);
            }
        });

        // 👤 名前保存ボタン
        document.getElementById('btn-save-name')?.addEventListener('click', async () => {
            const nameInput = document.getElementById('user-display-name').value.trim();
            if (!nameInput) {
                alert('名前を入力してください。');
                return;
            }
            if (currentUserUid) {
                await setDoc(doc(db, "users", currentUserUid), { name: nameInput }, { merge: true });
                currentUserName = nameInput;
                document.getElementById('name-setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                loadBbsPosts();
                loadChatMessages();
                loadRecords();
            }
        });

        // 🚪 ログアウト
        document.getElementById('btn-logout')?.addEventListener('click', () => {
            signOut(auth);
        });

        // 📦 備品追加フォームの開閉トグル
        document.getElementById('btn-toggle-add-tool')?.addEventListener('click', () => {
            const form = document.getElementById('add-tool-form');
            if (form) {
                form.style.display = form.style.display === 'none' ? 'block' : 'none';
            }
        });

        // 💰 支出記録の保存
        document.getElementById('btn-finance-submit')?.addEventListener('click', async () => {
            const date = document.getElementById('finance-date').value;
            const amount = document.getElementById('finance-amount').value;
            const title = document.getElementById('finance-title').value.trim();
            const payer = document.getElementById('finance-payer').value.trim();

            if (!date || !amount || !title) {
                alert('📅 日付、💴 金額、📌 用途を入力してください。');
                return;
            }

            try {
                await addDoc(collection(db, "finances"), {
                    date,
                    amount: Number(amount),
                    title,
                    payer: payer || currentUserName,
                    userName: currentUserName,
                    uid: currentUserUid,
                    createdAt: new Date()
                });

                document.getElementById('finance-date').value = '';
                document.getElementById('finance-amount').value = '';
                document.getElementById('finance-title').value = '';
                document.getElementById('finance-payer').value = '';

                alert('💰 支出を記録しました！');
            } catch (e) {
                console.error("支出記録エラー:", e);
                alert('記録の保存に失敗しました。');
            }
        });

        // 📋 掲示板読み込み
        function loadBbsPosts() {
            const q = query(collection(db, "bbs_posts"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('bbs-list');
                if(!list) return;
                list.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <div class="post-title">${data.title}</div>
                        <div><span class="badge badge-user">👤 ${data.userName || '不明'}</span></div>
                        <p style="white-space:pre-wrap; margin-top:10px; font-size:0.95rem;">${data.content}</p>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // 💬 チャット読み込み
        function loadChatMessages() {
            const q = query(collection(db, "chat_messages"), orderBy("createdAt", "asc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('chat-messages');
                if(!list) return;
                list.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    const isMe = data.uid === currentUserUid;
                    div.className = `chat-bubble ${isMe ? 'my-msg' : 'other-msg'}`;
                    div.innerHTML = `
                        <div style="font-size:0.75rem; opacity:0.8;">${data.userName}</div>
                        <div>${data.text}</div>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // 📝 練習記録読み込み
        function loadRecords() {
            const q = query(collection(db, "records"), orderBy("date", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('record-list');
                if(!list) return;
                list.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = 'post';
                    let timeText = data.createdAt ? `<span style="font-size:0.8rem; color:rgba(255,255,255,0.5); margin-left:8px;">(${formatDateTime(data.createdAt)})</span>` : '';
                    div.innerHTML = `
                        <div class="post-title">［${data.date}］${data.className} - ${data.boat}${timeText}</div>
                        <div><span class="badge badge-user">👤 記録者: ${data.userName || '不明'}</span></div>
                        <p style="white-space:pre-wrap; margin-top:10px; font-size:0.95rem;">${data.text}</p>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // 🔘 タブ切り替え処理
        const navButtons = document.querySelectorAll('nav button');
        const sections = document.querySelectorAll('.content-section');

        navButtons.forEach(button => {
            button.addEventListener('click', () => {
                const targetId = button.id.replace('nav-', 'sec-');
                
                navButtons.forEach(btn => btn.classList.remove('active'));
                sections.forEach(sec => sec.classList.remove('active'));

                button.classList.add('active');
                document.getElementById(targetId)?.classList.add('active');
            });
        });
    </script>
</body>
</html>
