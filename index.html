    <style>
        :root {

            --text-color: #ffffff;
            --accent-color: #4ea8de;
            --btn-bg: #5bc0be;
            --danger-color: #ff4757;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: var(--card-bg);
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
            position: relative;
        }
        .logout-btn {
            position: absolute;
            right: 15px;
            top: 12px;
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: var(--card-bg);
            padding: 10px 0;
            flex-wrap: wrap;
        }
        nav button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.85rem;
            padding: 8px 10px;
            cursor: pointer;
            border-radius: 5px;
            margin: 2px;
        }
        nav button.active {
            background-color: var(--accent-color);
        }
        .content-section {
            display: none;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            box-sizing: border-box;
        }
        .content-section.active {
            display: block;
        }
        input, textarea, select, button.submit-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background-color: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            box-sizing: border-box;
        }
        select option {
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        button.submit-btn {
            background-color: var(--btn-bg);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .post {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 5px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-color);
        }
        .post.priority-high {
            border-left: 5px solid var(--danger-color);
        }
        .post-title {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .badge {
            display: inline-block;
            padding: 2px 6px;
            font-size: 0.75rem;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 5px;
            color: #fff;
        }
        .badge-high { background-color: var(--danger-color); }
        .badge-normal { background-color: rgba(255,255,255,0.2); }
        .badge-date { background-color: #ffa502; color: #000; }
        .badge-user { background-color: #a855f7; color: white; }
        .badge-loc { background-color: #2ed573; color: black; }

            background-color: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            margin-bottom: 15px;
            border: 1px dashed var(--accent-color);

            display: block;
            text-align: center;
            background-color: #4ea8de;
            color: white;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;

            justify-content: center;
            align-items: center;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;

            z-index: 9999;

        .login-box {

            { name: "水道ホース", location: "その他", memo: "" },
            { name: "リベット", location: "その他", memo: "いっぱい" },
            { name: "モンキーレンチ", location: "その他", memo: "1" },
            { name: "バイスプライヤー（錆び）", location: "その他", memo: "1" },
            { name: "布団乾燥機", location: "その他", memo: "1" },
            { name: "ノコギリ", location: "その他", memo: "2種類" },
            { name: "切られたまな板", location: "その他", memo: "センターボード用？" },
            { name: "バッテリー充電器", location: "その他", memo: "" },
            { name: "はかり", location: "その他", memo: "2kgまで" },
            { name: "ドライヤー", location: "その他", memo: "" }
        ];

        // ⚙️ 初回データ登録チェック
        async function checkAndInitTools() {
            try {
                const toolsRef = collection(db, "tools");
                const snapshot = await getDocs(toolsRef);
                if (snapshot.empty) {
                    for (const tool of initialTools) {
                        await addDoc(toolsRef, tool);
                    }
                }
            } catch (error) {
                console.error("初期データ登録エラー:", error);
            }
        }

        // 📱 備品データの読み込み表示
        function loadTools() {
            const toolsRef = collection(db, "tools");
            onSnapshot(toolsRef, (snapshot) => {
                const list = document.getElementById('tools-list');
                if (!list) return;
                list.innerHTML = '';

                if (snapshot.empty) {
                    list.innerHTML = '<p style="color:rgba(255,255,255,0.5); text-align:center;">備品データがありません。</p>';
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const div = document.createElement('div');
                    div.className = 'post tool-item';
                    div.innerHTML = `
                        <div class="post-title">${data.name}</div>
                        <div>
                            <span class="badge badge-loc">📍 ${data.location || '未設定'}</span>
                        </div>
                        <p style="margin-top:8px; font-size:0.9rem; color:rgba(255,255,255,0.8);">📝 数量/メモ: ${data.memo || 'なし'}</p>
                    `;
                    list.appendChild(div);
                });
            });
        }

        // 🔍 備品検索
        document.getElementById('tools-search')?.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const items = document.querySelectorAll('#tools-list .tool-item');
            items.forEach(item => {
                const content = item.innerText.toLowerCase();
                if (content.includes(keyword)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        });

        onAuthStateChanged(auth, async (user) => {
            const loginScreen = document.getElementById('login-screen');
            const appContainer = document.getElementById('app-container');
            const nameSetupScreen = document.getElementById('name-setup-screen');
            
            if (user) {
                currentUserUid = user.uid;
                loginScreen.style.display = 'none';

                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDocSnap = await getDoc(userDocRef);

                    if (userDocSnap.exists()) {
                        currentUserName = userDocSnap.data().name;
                        document.getElementById('welcome-msg').innerText = `${currentUserName} さん`;
                        nameSetupScreen.style.display = 'none';
                        appContainer.style.display = 'block';
                        
                        await checkAndInitTools();
                        loadTools();
                        loadRecords();
                        loadMaintenanceRecords();
                        loadBbsPosts();
                    } else {
                        appContainer.style.display = 'none';
                        nameSetupScreen.style.display = 'flex';
                    }
                } catch (e) {
                    console.error("ユーザー情報の取得エラー:", e);
                }
            } else {
                loginScreen.style.display = 'flex';
                appContainer.style.display = 'none';
                nameSetupScreen.style.display = 'none';
                document.getElementById('welcome-msg').innerText = "";
            }
        });

        document.getElementById('btn-save-name').addEventListener('click', async () => {
            const nameInput = document.getElementById('user-display-name').value.trim();
            if (!nameInput) {
                alert('名前を入力してください。');
                return;
            }

            try {
                await setDoc(doc(db, "users", currentUserUid), {
                    name: nameInput,
                    email: auth.currentUser.email
                });
                currentUserName = nameInput;
                document.getElementById('welcome-msg').innerText = `${currentUserName} さん`;
                document.getElementById('name-setup-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                
                await checkAndInitTools();
                loadTools();
                loadRecords();
                loadMaintenanceRecords();
                loadBbsPosts();
                alert('👤 名前の登録が完了しました！');
            } catch (e) {
                console.error("名前の保存エラー: ", e);
                alert('名前の保存に失敗しました。');
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                alert('IDとパスワードを入力してください。');
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then(() => { alert('🎉 ログインに成功しました！'); })
                .catch((error) => {
                    console.error("ログインエラー:", error);
                    alert('❌ ログインに失敗しました。IDとパスワードを確認してください。');
                });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { alert('🔓 ログアウトしました。'); });
        });

        const boatData = {
            "470": ["4237", "4146", "4706", "4572", "陸待or整備"],
            "スナイプ": ["31594", "31287", "31245", "31067", "28675", "30575", "陸待or整備"],
            "レスキュー艇": ["ネプチューン", "パルパロ5", "牛若丸"]
        };

        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById('sec-' + tabId)) document.getElementById('sec-' + tabId).classList.add('active');
            if(document.getElementById('nav-' + tabId)) document.getElementById('nav-' + tabId).classList.add('active');
        }

        document.getElementById('nav-weather').addEventListener('click', () => switchTab('weather'));
        document.getElementById('nav-bbs').addEventListener('click', () => switchTab('bbs'));
        document.getElementById('nav-maintenance').addEventListener('click', () => switchTab('maintenance'));
        document.getElementById('nav-record').addEventListener('click', () => switchTab('record'));
        document.getElementById('nav-tools').addEventListener('click', () => switchTab('tools'));

        function updateBoatOptions(classSelectId, boatSelectId) {
            const classSelect = document.getElementById(classSelectId);
            const boatSelect = document.getElementById(boatSelectId);
            const selectedClass = classSelect.value;

            boatSelect.innerHTML = '';

            if (selectedClass && boatData[selectedClass]) {
                boatSelect.disabled = false;
                boatData[selectedClass].forEach(boat => {
                    const opt = document.createElement('option');
                    opt.value = boat;
                    opt.textContent = boat;
                    boatSelect.appendChild(opt);
                });
            } else {
                boatSelect.disabled = true;
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "-- 先にクラスを選択してください --";
                boatSelect.appendChild(opt);
            }
        }

        document.getElementById('maint-class').addEventListener('change', () => updateBoatOptions('maint-class', 'maint-boat'));
        document.getElementById('record-class').addEventListener('change', () => updateBoatOptions('record-class', 'record-boat'));

        // 🔍 掲示板検索
        document.getElementById('bbs-search').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase().trim();
            const posts = document.querySelectorAll('#bbs-list .post');
            posts.forEach(post => {
                const title = post.querySelector('.post-title')?.innerText.toLowerCase() || "";
                const content = post.innerText.toLowerCase();
                if (title.includes(keyword) || content.includes(keyword)) {
                    post.style.display = 'block';
                } else {
                    post.style.display = 'none';
                }
            });
        });

        // 📋 掲示板投稿
        document.getElementById('btn-bbs-submit').addEventListener('click', async () => {
            const title = document.getElementById('bbs-title').value.trim();
            const priority = document.getElementById('bbs-priority').value;
            const date = document.getElementById('bbs-date').value;
            const text = document.getElementById('bbs-input').value.trim();

            if (!title || !text) {
                alert('題名と本文を入力してください。');
                return;
            }

            try {
                await addDoc(collection(db, "bbs"), {
                    title, priority, date, text,
                    userName: currentUserName,
                    createdAt: new Date()
                });
                document.getElementById('bbs-title').value = '';
                document.getElementById('bbs-date').value = '';
                document.getElementById('bbs-input').value = '';
                alert('📋 掲示板に投稿しました！');
            } catch (e) {
                console.error("掲示板投稿エラー:", e);
                alert('投稿に失敗しました。');
            }
        });

        function loadBbsPosts() {
            const q = query(collection(db, "bbs"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('bbs-list');
                const alertList = document.getElementById('alert-list');
                const alertArea = document.getElementById('weather-bbs-alerts');
                
                if (!list) return;
                list.innerHTML = '';
                if (alertList) alertList.innerHTML = '';

                const now = new Date();
                const todayStr = now.toISOString().split('T')[0]; 
                
                const threeDaysLater = new Date();
                threeDaysLater.setDate(now.getDate() + 3);
                const threeDaysLaterStr = threeDaysLater.toISOString().split('T')[0];

                let hasAlerts = false;

                snapshot.forEach((doc) => {
                    const data = doc.data();
                    
                    const div = document.createElement('div');
                    div.className = `post ${data.priority === 'high' ? 'priority-high' : ''}`;
                    
                    let badges = `<span class="badge ${data.priority === 'high' ? 'badge-high' : 'badge-normal'}">${data.priority === 'high' ? '🚨 重要' : '💬 通常'}</span>`;
                    if (data.date) badges += `<span class="badge badge-date">📅 ${data.date}</span>`;
                    badges += `<span class="badge badge-user">👤 ${data.userName || '部員'}</span>`;

                    const dateText = data.date ? `<span style="font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-left: 10px;">(${data.date})</span>` : '';
                    
                    div.innerHTML = `
                        <div class="post-title">${data.title}${dateText}</div>
                        <div>${badges}</div>
                        <p style="white-space:pre-wrap; margin-top:10px; font-size:0.95rem;">${data.text}</p>
                    `;
                    list.appendChild(div);

                    if (data.date && alertList) {
                        if (data.date >= todayStr && data.date <= threeDaysLaterStr) {
                            hasAlerts = true;
                            const alertDiv = document.createElement('div');
                            alertDiv.className = `post ${data.priority === 'high' ? 'priority-high' : ''}`;
                            alertDiv.innerHTML = `
                                <div class="post-title" style="font-size: 0.95rem;">${data.title} <span style="color:#ffa502;">(期日: ${data.date})</span></div>
                                <p style="white-space:pre-wrap; margin-top:5px; font-size:0.85rem; color:rgba(255,255,255,0.8);">${data.text}</p>
                            `;
                            alertList.appendChild(alertDiv);
                        }
                    }
                });

                if (alertArea) {
                    alertArea.style.display = hasAlerts ? 'block' : 'none';
                }
            });
        }

        // 🛠️ ヨット管理
        document.getElementById('btn-maint-submit').addEventListener('click', async () => {
            const date = document.getElementById('maint-date').value;
            const className = document.getElementById('maint-class').value;
            const boat = document.getElementById('maint-boat').value;
            const text = document.getElementById('maint-text').value.trim();

            if (!date || !className || !boat || !text) {
                alert('すべての項目を入力してください。');
                return;
            }

            try {
                await addDoc(collection(db, "maintenance"), {
                    date, className, boat, text,
                    userName: currentUserName,
                    createdAt: new Date()
                });
                
                fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        'type': 'maintenance',
                        'date': date,
                        'class': className,
                        'boat': boat,
                        'text': text,
                        'user': currentUserName
                    })
                }).catch(e => console.error("GAS送信エラー:", e));

                document.getElementById('maint-text').value = '';
                alert('🛠️ 管理記録を保存しました！');
            } catch (e) {
                console.error("整備記録保存エラー:", e);
                alert('保存に失敗しました。');
            }
        });

        let allMaintRecords = [];
        function loadMaintenanceRecords() {
            const q = query(collection(db, "maintenance"), orderBy("date", "desc"));
            onSnapshot(q, (snapshot) => {
                allMaintRecords = [];
                snapshot.forEach(doc => {
                    allMaintRecords.push(doc.data());
                });
                applyMaintenanceFilter();
            });
        }

        function applyMaintenanceFilter() {
            const filterValue = document.getElementById('filter-boat').value;
            const list = document.getElementById('maint-list');
            if(!list) return;
            list.innerHTML = '';

            const filtered = allMaintRecords.filter(rec => filterValue === 'all' || rec.boat === filterValue);

            if(filtered.length === 0) {
                list.innerHTML = '<p style="color:rgba(255,255,255,0.5); text-align:center;">記録がありません。</p>';
                return;
            }

            filtered.forEach(data => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `
                    <div class="post-title">［${data.date}］${data.className} - ${data.boat}</div>
                    <div><span class="badge badge-user">👤 記録者: ${data.userName || '不明'}</span></div>
                    <p style="white-space:pre-wrap; margin-top:10px; font-size:0.95rem;">${data.text}</p>
                `;
                list.appendChild(div);
            });
        }

        document.getElementById('filter-boat').addEventListener('change', applyMaintenanceFilter);

        // 📝 練習記録
        document.getElementById('btn-record-submit').addEventListener('click', async () => {
            const date = document.getElementById('record-date').value;
            const className = document.getElementById('record-class').value;
            const boat = document.getElementById('record-boat').value;
            const text = document.getElementById('record-text').value.trim();

            if (!date || !className || !boat || !text) {
                alert('すべての項目を入力してください。');
                return;
            }

            try {
                await addDoc(collection(db, "records"), {
                    date, className, boat, text,
                    userName: currentUserName,
                    createdAt: new Date()
                });

                fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: new URLSearchParams({
                        'type': 'record',
                        'date': date,
                        'class': className,
                        'boat': boat,
                        'text': text,
                        'user': currentUserName
                    })
                }).catch(e => console.error("GAS送信エラー:", e));

                document.getElementById('record-text').value = '';
                alert('📝 練習記録を保存しました！');
            } catch (e) {
                console.error("練習記録保存エラー:", e);
                alert('保存に失敗しました。');
            }
        });

        function loadRecords() {
            const q = query(collection(db, "records"), orderBy("date", "desc"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('record-list');
                if(!list) return;
                list.innerHTML = '';
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <div class="post-title">［${data.date}］${data.className} - ${data.boat}</div>
                        <div><span class="badge badge-user">👤 記録者: ${data.userName || '不明'}</span></div>
                        <p style="white-space:pre-wrap; margin-top:10px; font-size:0.95rem;">${data.text}</p>
                    `;
                    list.appendChild(div);
                });
            });
        }
    </script></body></html>
