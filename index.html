<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YACHT NAVI Lite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #ffffff;
            --accent-color: #4ea8de;
            --btn-bg: #5bc0be;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            background-color: var(--card-bg);
            width: 100%;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 2px solid var(--accent-color);
        }
        nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background-color: var(--card-bg);
            padding: 10px 0;
        }
        nav button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 0.9rem;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 5px;
        }
        nav button.active {
            background-color: var(--accent-color);
        }
        .content-section {
            display: none;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
        }
        .content-section.active {
            display: block;
        }
        input, textarea, button.submit-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: none;
            box-sizing: border-box;
        }
        button.submit-btn {
            background-color: var(--btn-bg);
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
        }
        .post {
            background-color: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>⛵ YACHT NAVI Lite</header>

    <nav>
        <button id="nav-weather" class="active" onclick="switchTab('weather')">☀️ 天気予報</button>
        <button id="nav-bbs" onclick="switchTab('bbs')">📋 掲示板</button>
        <button id="nav-camera" onclick="switchTab('camera')">📹 ライブカメラ</button>
        <button id="nav-record" onclick="switchTab('record')">📝 練習記録</button>
    </nav>

    <div id="sec-weather" class="content-section active">
        <h3>☀️ 江の島 天気・風速</h3>
        <p>予報データがここに表示されます（調整中）</p>
    </div>

    <div id="sec-bbs" class="content-section">
        <h3>📋 部内共有掲示板</h3>
        <textarea id="bbs-input" placeholder="連絡事項を入力してください..."></textarea>
        <button class="submit-btn" onclick="addPost()">投稿する</button>
        <div id="bbs-list"></div>
    </div>

    <div id="sec-camera" class="content-section">
        <h3>📹 ライブカメラ</h3>
        <p>海の状況を確認しましょう。</p>
    </div>

    <div id="sec-record" class="content-section">
        <h3>📝 練習記録</h3>
        <input type="text" id="record-title" placeholder="今日の日付やタイトル">
        <textarea id="record-text" placeholder="今日の練習内容や反省点..."></textarea>
        <button class="submit-btn" onclick="addRecord()">記録を保存</button>
        <div id="record-list"></div>
    </div>

    <script>
        // タブ切り替えのプログラム
        function switchTab(tabId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('sec-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
        }

        // 掲示板の投稿プログラム
        function addPost() {
            const input = document.getElementById('bbs-input');
            if (!input.value.trim()) return;
            
            const post = document.createElement('div');
            post.className = 'post';
            post.innerText = input.value;
            
            document.getElementById('bbs-list').prepend(post);
            input.value = '';
        }

        // 練習記録の保存プログラム
        function addRecord() {
            const title = document.getElementById('record-title');
            const text = document.getElementById('record-text');
            if (!text.value.trim()) return;

            const record = document.createElement('div');
            record.className = 'post';
            record.innerHTML = `<strong>${title.value || '無題'}</strong><br>${text.value}`;

            document.getElementById('record-list').prepend(record);
            title.value = '';
            text.value = '';
        }
    </script>
</body>
</html>
